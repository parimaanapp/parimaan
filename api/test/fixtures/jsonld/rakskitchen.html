r potato stuffing is too wet from overcooking the potato.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/rakskitchen.net\/aloo-paratha\/#faq-question-1782574264447","position":2,"url":"https:\/\/rakskitchen.net\/aloo-paratha\/#faq-question-1782574264447","name":"My paratha is not soft, why?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Make sure not to cook in low flame for long time. The dough consistency matters. It should be soft and pliable for a perfect texture. ","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/rakskitchen.net\/aloo-paratha\/#faq-question-1782598886979","position":3,"url":"https:\/\/rakskitchen.net\/aloo-paratha\/#faq-question-1782598886979","name":"Can I make aloo paratha without a tawa?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Yes, any heavy flat-bottomed skillet works, as long as it holds even heat. Cast iron skillet is a great alternative for a traditional tawa. But you can pretty much make it in non-stick pan too.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Recipe","name":"Easy Aloo Paratha Recipe | Spiced Potato Stuffed Flatbread","author":{"@id":"https:\/\/rakskitchen.net\/#\/schema\/person\/cd191ded5109709ce08e4868ab1d2b1f"},"description":"Aloo paratha is a north Indian breakfast, made with a potato stuffing and generous butter. A super easy recipe with side dish for paratha too.","datePublished":"2008-01-04T15:19:00+00:00","image":["https:\/\/rakskitchen.net\/wp-content\/uploads\/2008\/01\/spiced-potato-flatbread.jpg","https:\/\/rakskitchen.net\/wp-content\/uploads\/2008\/01\/spiced-potato-flatbread-500x500.jpg","https:\/\/rakskitchen.net\/wp-content\/uploads\/2008\/01\/spiced-potato-flatbread-500x375.jpg","https:\/\/rakskitchen.net\/wp-content\/uploads\/2008\/01\/spiced-potato-flatbread-480x270.jpg"],"video":{"name":"Aloo paratha making, soft stuffed paratha | Aalu paratha recipe","description":"Aloo paratha is almost the most favorite stuffed paratha for all. I learnt aloo paratha from my Sindhi friend Sangeeta who taught me simple stuffing with just chilli, ajwain or cumin seeds and with lots of coriander leaves.\nShe makes it effortlessly and thin.\nI have a detailed post in my blog posted back in 2008. This video is an update for my blogpost.\nThe post includes a quick side dish for aloo paratha. Check it out :\n\nGeneral tips for stuffed paratha:\nHow to make soft stuffed parathas?\n*Make soft dough with oil and lukewarm water. Don't make the dough tight. Make it soft and pliable. Give resting time, which is also important.\n*Almost mantra for me, make stuffing and dough equal consistency and equal sized balls.\n*Cook in hot tawa, long cooking time - harder and chewy paratha.\n*Use generous oil or ghee for lovely golden spots over your paratha. I like to add oil not to the pan and over the paratha.\n*Puffed paratha - soft paratha. \n*Use a bamboo basket lined with kitchen towel or wire rack to stack to avoid the condensed water making paratha soggy.\nAmazon affiliate link for tawa :","uploadDate":"2020-03-09T00:50:52+00:00","duration":"PT4M3S","thumbnailUrl":"https:\/\/i.ytimg.com\/vi\/ACNAzzacunI\/hqdefault.jpg","embedUrl":"https:\/\/www.youtube.com\/embed\/ACNAzzacunI?feature=oembed","contentUrl":"https:\/\/www.youtube.com\/watch?v=ACNAzzacunI","@type":"VideoObject"},"recipeYield":["5","5 Parathas"],"prepTime":"PT15M","cookTime":"PT30M","recipeIngredient":["1 cup Wheat flour","1 tsp Oil (optional )","Salt","luke warm water as needed","3  Potatoes","3 tbsp Coriander leaves","4  Green chilies","½ tsp Ajwain ( Omam)","Salt"],"recipeInstructions":[{"@type":"HowToSection","name":"Prepare dough","itemListElement":[{"@type":"HowToStep","text":"Take flour, salt in a mixing bowl firstly. Then drizzle oil and give it a quick mix.","name":"Take flour, salt in a mixing bowl firstly. Then drizzle oil and give it a quick mix.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-0-0"},{"@type":"HowToStep","text":"After that add luke-warm water little by little to get a soft yet non sticky dough. Set aside covered.","name":"After that add luke-warm water little by little to get a soft yet non sticky dough. Set aside covered.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-0-1"}]},{"@type":"HowToSection","name":"Potato stuffing","itemListElement":[{"@type":"HowToStep","text":"To make the stuffing, cook potato until done and peel off the skin. Do not overcook, as it will retain water and make your rolling difficult.","name":"To make the stuffing, cook potato until done and peel off the skin. Do not overcook, as it will retain water and make your rolling difficult.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-1-0"},{"@type":"HowToStep","text":"I usually Microwave my potato for cooking it perfectly without any moisture. You can choose your own method - Boiling\/ pressure cooking.","name":"I usually Microwave my potato for cooking it perfectly without any moisture. You can choose your own method - Boiling\/ pressure cooking.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-1-1"},{"@type":"HowToStep","text":"Mash well and add finely chopped green chilli, coriander leaves, ajwain and required salt. Mix well.","name":"Mash well and add finely chopped green chilli, coriander leaves, ajwain and required salt. Mix well.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-1-2"},{"@type":"HowToStep","text":"Make equal sized balls and keep it ready. I usually roll both stuffing and dough equal sized for balanced taste.","name":"Make equal sized balls and keep it ready. I usually roll both stuffing and dough equal sized for balanced taste.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-1-3"}]},{"@type":"HowToSection","name":"Make flatbread","itemListElement":[{"@type":"HowToStep","text":"Make equal sized balls out of the dough and the stuffing.","name":"Make equal sized balls out of the dough and the stuffing.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-2-0"},{"@type":"HowToStep","text":"Firstly roll the dough into palm size thick disk.","name":"Firstly roll the dough into palm size thick disk.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-2-1"},{"@type":"HowToStep","text":"Keep the stuffing inside. Cover the stuffing with the dough.","name":"Keep the stuffing inside. Cover the stuffing with the dough.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-2-2"},{"@type":"HowToStep","text":"Roll into parathas of desired thickness. Dust generously while rolling.","name":"Roll into parathas of desired thickness. Dust generously while rolling.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-2-3"}]},{"@type":"HowToSection","name":"Cooking flatbread","itemListElement":[{"@type":"HowToStep","text":"Heat tawa and place paratha over it. Cook for a minute in high flame.","name":"Heat tawa and place paratha over it. Cook for a minute in high flame.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-3-0"},{"@type":"HowToStep","text":"After that, flip and cook furthermore for a minute in medium flame.","name":"After that, flip and cook furthermore for a minute in medium flame.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-3-1"},{"@type":"HowToStep","text":"Now drizzle few drops of ghee or oil and cook both sides. This helps puffing, golden spots appearing over paratha.","name":"Now drizzle few drops of ghee or oil and cook both sides. This helps puffing, golden spots appearing over paratha.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-3-2"},{"@type":"HowToStep","text":"Be generous with oil or ghee if you want more golden spots. Press gently with spatula for even browning.","name":"Be generous with oil or ghee if you want more golden spots. Press gently with spatula for even browning.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-3-3"},{"@type":"HowToStep","text":"Repeat to finish and regulate the heat as needed.","name":"Repeat to finish and regulate the heat as needed.","url":"https:\/\/rakskitchen.net\/aloo-paratha\/#wprm-recipe-19414-step-3-4"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"6","reviewCount":"1"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"That chutney was amazing. Thank you so much.","author":{"@type":"Person","name":"KIRUBA"},"datePublished":"2020-03-28"}],"recipeCategory":["Breakfast"],"recipeCuisine":["Indian"],"keywords":"aloo paratha, aloo paratha side dish","@id":"https:\/\/rakskitchen.net\/aloo-paratha\/#recipe","isPartOf":{"@id":"https:\/\/rakskitchen.net\/aloo-paratha\/#article"},"mainEntityOfPage":"https:\/\/rakskitchen.net\/aloo-paratha\/"}]}</script>
