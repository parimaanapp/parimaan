d boil for 5 minutes, until the mixture is well-cooked.","name":"Keep cooking and boil for 5 minutes, until the mixture is well-cooked.","url":"https:\/\/hebbarskitchen.com\/paneer-butter-masala-recipe\/#wprm-recipe-146574-step-0-10"},{"@type":"HowToStep","text":"Now add 1 tsp salt, 1 tsp sugar, 2 tbsp cream and mix well.","name":"Now add 1 tsp salt, 1 tsp sugar, 2 tbsp cream and mix well.","url":"https:\/\/hebbarskitchen.com\/paneer-butter-masala-recipe\/#wprm-recipe-146574-step-0-11"},{"@type":"HowToStep","text":"Add 20 cubes paneer and simmer for 5 minutes till the flavours are absorbed.","name":"Add 20 cubes paneer and simmer for 5 minutes till the flavours are absorbed.","url":"https:\/\/hebbarskitchen.com\/paneer-butter-masala-recipe\/#wprm-recipe-146574-step-0-12"},{"@type":"HowToStep","text":"Add 2 tbsp kasuri methi and 2 tbsp coriander. Mix well.","name":"Add 2 tbsp kasuri methi and 2 tbsp coriander. Mix well.","url":"https:\/\/hebbarskitchen.com\/paneer-butter-masala-recipe\/#wprm-recipe-146574-step-0-13"},{"@type":"HowToStep","text":"Finally, enjoy Paneer Butter Masala Recipe with roti.","name":"Finally, enjoy Paneer Butter Masala Recipe with roti.","url":"https:\/\/hebbarskitchen.com\/paneer-butter-masala-recipe\/#wprm-recipe-146574-step-0-14"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.96","ratingCount":"359","reviewCount":"4"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I Enjoyed making this. I found it very easy to do!!!","author":{"@type":"Person","name":"Karan Murali"},"datePublished":"2026-02-17"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Tried. Tastes great.","author":{"@type":"Person","name":"Vijayalakshmi"},"datePublished":"2026-01-09"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Loved it! Tasted just like the kind we get at restaurants. I blindly trust your recipes. Every dish I cook from here t
