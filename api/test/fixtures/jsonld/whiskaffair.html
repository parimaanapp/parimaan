\/06\/Achari-Aloo-2-3.jpg","https:\/\/www.whiskaffair.com\/wp-content\/uploads\/2018\/06\/Achari-Aloo-2-3-500x500.jpg","https:\/\/www.whiskaffair.com\/wp-content\/uploads\/2018\/06\/Achari-Aloo-2-3-500x375.jpg","https:\/\/www.whiskaffair.com\/wp-content\/uploads\/2018\/06\/Achari-Aloo-2-3-480x270.jpg"],"video":{"name":"Achari Aloo Video Recipe","description":"Achari Aloo Masala (Aloo Achari) is a North Indian style potato dish made using potatoes and Indian pickling spices. It is spicy and tangy and can be served with parathas for breakfast or as a side dish with your everyday meals. Here is how to make it (vegan).","thumbnailUrl":"https:\/\/content.jwplatform.com\/thumbs\/lofy1KVJ-720.jpg","contentUrl":"https:\/\/content.jwplatform.com\/videos\/lofy1KVJ.mp4","uploadDate":"2025-07-01T14:00:28+00:00","@type":"VideoObject"},"recipeYield":["4","4 people"],"prepTime":"PT10M","cookTime":"PT20M","totalTime":"PT30M","recipeIngredient":["3 tablespoons mustard oil (or any other cooking oil)","¼ teaspoon asafetida (hing) (skip for gluten-free)","½ teaspoon cumin seeds","1 teaspoon grated ginger","2 teaspoons chopped green chilies","1 pound potatoes (500 g, peeled and cut into ½ inch thick wedges)","2 tablespoons achari masala powder (recipe to make it is in the notes)","½ teaspoon turmeric powder","1 teaspoon Kashmiri red chili powder","½ teaspoon salt  (or to taste)","1 teaspoon dry mango powder (amchoor)","2 tablespoons chopped cilantro (fresh coriander leaves)"],"recipeInstructions":[{"@type":"HowToStep","text":"Heat oil in a pan over medium-high heat.","name":"Heat oil in a pan over medium-high heat.","url":"https:\/\/www.whiskaffair.com\/achari-aloo\/#wprm-recipe-26075-step-0-0"},{"@type":"HowToStep","text":"When the oil is hot, add asafetida and cumin seeds and let them crackle for 5-6 seconds.","name":"When the oil is hot, add asafetida and cumin seeds and let them crackle for 5-6 seconds.","url":"https:\/\/www.whiskaffair.com\/achari-aloo\/#wprm-recipe-26075-step-0-1" cipe-26075-step-0-9"},{"@type":"HowToStep","text":"Serve hot with phulka and dal.","name":"Serve hot with phulka and dal.","url":"https:\/\/www.whiskaffair.com\/achari-aloo\/#wprm-recipe-26075-step-0-10"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.34","ratingCount":"9","reviewCount":"2"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Made it with cubed potatoes, huge hit!! Have made it several times since then :)","author":{"@type":"Person","name":"911sherlock"},"datePublished":"2020-06-03"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"normally people put small round potatoes for this recipe but you have sliced it nice idea, keep it up","author":{"@type":"Person","name":"chethan m"},"datePublished":"2018-04-08"}],"recipeCategory":["Main Course"],"recipeCuisine":["Indian"],"suitableForDiet":["https:\/\/schema.org\/VeganDiet","https:\/\/schema.org\/VegetarianDiet"],"keywords":"Achari Aloo, Achari Aloo Masala, Aloo Achari","nutrition":{"@type":"NutritionInformation","calories":"180 kcal","carbohydrateContent":"18 g","proteinContent":"3 g","fatContent":"10 g","saturatedFatContent":"1 g","sodiumContent":"63 mg","fiberContent":"3 g","servingSize":"1 serving"},"@id":"https:\/\/www.whiskaffair.com\/achari-aloo\/#recipe","isPartOf":{"@id":"https:\/\/www.whiskaffair.com\/achari-aloo\/#article"},"mainEntityOfPage":"https:\/\/www.whiskaffair.com\/achari-aloo\/"}]}</script>
