<script type="application/ld+json">{"@context":"https://schema.org/","@type":"Recipe","@id":"https://www.archanaskitchen.com/recipe/mysore-masala-dosa-recipe","name":"Mysore Masala Dosa Made With Ragi Dosa Batter","headline":"Mysore Masala Dosa Made With Ragi Dosa Batter Recipe","image":"https://images.archanaskitchen.com/images/recipes/indian/indian-breakfast-tiffin-recipes/dosa-recipes/thumbnail_Mysore_Masala_Dosa_Recipe_b6306817ec.jpg","description":"You must try this delicious Mysore Masala Dosa Recipe which is smeared with red chilli chutney and stuffed with potato filling and served with chutney and sambar. This dosa is made with ragi idli dosa batter adding to the taste and nutrition. ","author":{"@type":"Person","name":"Archana's Kitchen","url":"https://www.archanaskitchen.com/author/archanas-kitchen"},"publisher":{"@type":"Organization","name":"Archana's Kitchen","url":"https://www.archanaskitchen.com","logo":{"@type":"ImageObject","url":"https://www.archanaskitchen.com/logo.png"}},"datePublished":"2018-01-08T22:00:00.000Z","dateModified":"2020-04-10T18:40:02.000Z","prepTime":"PT20M","cookTime":"PT40M","totalTime":"PT60M","recipeYield":"4","recipeCategory":"Dosa Recipes","recipeCuisine":"Karnataka","suitableForDiet":"VegetarianDiet","keywords":"Vegetarian Recipes, Aloo Recipes (Potato & Baby Potato Recipes), South Indian Breakfast Recipes, Millet Recipes, Ragi Recipes (Nachni/ Finger Millet), Karnataka Recipes","recipeIngredient":["1 cup Idli Rice (a special rice available in the indian stores for making idli and dosas)","1/2 cup Ragi Seeds ","1 cup White Urad Dal (Whole) ","1 teaspoon Methi Seeds (Fenugreek Seeds) "," Water for soaking the rice","1 Onion chopped","3 tablespoon Roasted Gram Dal (Pottukadalai) ","2 Dry Red Chillies ","4 cloves Garlic ","1 inch Ginger chopped"," Salt to taste","4 Potatoes (Aloo) ","1 teaspoon Cumin seeds (Jeera) ","1 sprig Curry leaves ","1 pinch Asafoetida (hing) ","1 Onion sliced","1 teaspoon Turmeric powder (Haldi) ","4 sprig Coriander (Dhania) Leaves chopped"," Salt to taste "],"recipeInstructions":[{"@type":"HowToStep","position":1,"text":"To begin making the Mysore Masala Dosa Recipe, we will first make the Ragi (Millet) Idli Dosa Batter.","image":{"data":null}},{"@type":"HowToStep","position":2,"text":"Add idli rice and ragi in a big bowl together, the level of water required is an inch above the rice in the bowl. Let it soak for about 6 hours.","image":{"data":null}},{"@type":"HowToStep","position":3,"text":"Soak the urad dal and fenugreek in water such that all of the dal is completely immersed in water. The level of water will be 2 inches above the dal in the bowl. Let it soak for about 6 hours.","image":{"data":null}},{"@type":"HowToStep","position":4,"text":"First grind the urad dal into a fine smooth batter. While grinding just enough water to make it into a very very smooth batter. The batter will look fluffy.","image":{"data":null}},{"@type":"HowToStep","position":5,"text":"Grind the rice and millet mixture into a smooth batter, adding just the required amount of water to grind into an almost smooth batter. Adding too much water will make the mixture too watery.","image":{"data":null}},{"@type":"HowToStep","position":6,"text":"Combine the urad and rice batter, add salt to taste and set aside for at least 12 hours or overnight until the batter ferments. You will notice the batter would have risen in volume.","image":{"data":null}},{"@type":"HowToStep","position":7,"text":"Hence you should place the batter in a large container so it has enough room to increase in its volume.","image":{"data":null}},{"@type":"HowToStep","position":1,"text":"Fermenting has to take place where the weather is warm. So ideally in summer, the batter ferments very well and doubles or triples its quantity.","image":{"data":null}},{"@type":"HowToStep","position":2,"text":"But in cold places, the batter has to be kept in an oven. If your oven has a light, then turn on the light for a few hours with the batter in the oven.","image":{"data":null}},{"@type":"HowToStep","position":3,"text":"Once the oven is warm, turn off the light and let the batter ferment. If your oven does not have a light, then preheat the oven to warm, turn off oven then keep the batter in the oven to ferment. This process can be mastered with experience.","image":{"data":null}},{"@type":"HowToStep","position":1,"text":"Soak the dry red chilli in warm water for at least 20 minutes.","image":{"data":null}},{"@type":"HowToStep","position":2,"text":"Once done you can add all the ingredients - Onion, ginger, garlic, roasted gram dal, soaked dry red chillies and salt into a mixer and grind with little water to form a coarse paste.","image":{"data":null}},{"@type":"HowToStep","position":3,"text":"You can check for seasoning and adjust the salt or spice level if you want later on and set aside in a bowl.","image":{"data":null}},{"@type":"HowToStep","position":1,"text":"Pressure cook the potatoes with 2 cups of water, sprinkle little salt and cook for atleast 4 whistle.","image":{"data":null}},{"@type":"HowToStep","position":2,"text":"Once done allow the pressure cooker to release naturally, and drain all the water and peel off the skin and mash the potatoes and set aside.","image":{"data":null}},{"@type":"HowToStep","position":3,"text":"Heat a flat skillet with oil, add mustard seeds and allow it to sizzle for few seconds. Sprinkle with hing and add curry leaves and allow it to sparkle for few seconds.","image":{"data":null}},{"@type":"HowToStep","position":4,"text":"Add sliced onions, ginger and garlic for few minutes and sauté until the onions turn translucent.","image":{"data":null}},{"@type":"HowToStep","position":5,"text":"Add turmeric powder, salt and boiled potatoes and mix well until it is well combined. Check for salt and add coriander leaves at the end and stir. Add it into a bowl and keep it ready.","image":{"data":null}},{"@type":"HowToStep","position":1,"text":"The next step is to assemble the dosa. Heat a dosa Tawa. Pour a small ladleful of dosa batter onto the Tawa and spread evenly with the back of the ladle to make a medium-sized dosa.","image":{"data":null}},{"@type":"HowToStep","position":2,"text":"Drizzle half a teaspoon of oil around the dosa and cook over low heat for few seconds. Spread a little red chutney all over the dosa and place some potato masala in the center of the dosa.","image":{"data":null}},{"@type":"HowToStep","position":3,"text":"Continue to cook the dosa over low heat till the dosa turned a little brown. Gently fold over one side and transfer the dosa to a serving plate.","image":{"data":null}},{"@type":"HowToStep","position":4,"text":"Serve Mysore Masala Dosa Recipe along with south Indian coconut chutney& Bangalore Restaurant Style Sambar to make your breakfast complete.","image":{"data":null}}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","ratingCount":"5003","bestRating":5,"worstRating":1},"mainEntityOfPage":{"@type":"WebPage","@id":"https://www.archanaskitchen.com/recipe/mysore-masala-dosa-recipe"},"isPartOf":{"@type":"WebSite","@id":"https://www.archanaskitchen.com"}}</script>
