tps://twitter.com/DassanasRecipes","https://www.pinterest.com/dassanaamit/","https://www.instagram.com/dassanasvegrecipes/","https://www.youtube.com/c/DassanasVegRecipes"]},{"@type":"BlogPosting","headline":"Aloo Paratha Recipe (Stuffed Potato Paratha) \u2013 Dassana\u2019s Veg Recipes","keywords":"aloo paratha,aloo paratha recipe","datePublished":"2022-11-01T23:03:12+05:30","dateModified":"2026-08-02T01:10:33+05:30","articleSection":"Breakfast Recipes, No Onion No Garlic Recipes, North Indian Food Recipes, Punjabi Food","author":{"@id":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#author","name":"Dassana Amit"},"publisher":{"@id":"https://www.vegrecipesofindia.com/#person"},"description":"Aloo Paratha is a popular Punjabi breakfast dish of whole wheat flatbreads stuffed with a spiced and tangy potato filling and cooked with oil or ghee.","name":"Aloo Paratha Recipe (Stuffed Potato Paratha) \u2013 Dassana\u2019s Veg Recipes","subjectOf":[{"@type":"FAQPage","mainEntity":[{"@type":"Question","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#faq-question-68658629d7f30","name":"How do I make the stuffing tangier?","acceptedAnswer":{"@type":"Answer","text":"Dry mango powder, also called amchur powder, gives the potato stuffing its tangy taste. You can use a little lemon juice if you do not have amchur. Anardana powder, or dried pomegranate seed powder, is another good option, though it may not be as readily available."}},{"@type":"Question","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#faq-question-68658629d7f32","name":"Can I add vegetables to the stuffing?","acceptedAnswer":{"@type":"Answer","text":"Yes. You can add small amounts of cooked and mashed green peas, carrots or French beans. Make sure the vegetables are not watery and mash them well. You can also add grated cheese or crumbled paneer for a different variation."}},{"@type":"Question","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#faq-question-68658629d7f33","name":"Which potatoes work best?","acceptedAnswer":{"@type":"Answer","text":"Use potatoes that become soft and mash smoothly after cooking. Russet potatoes and other starchy varieties work especially well because they give the stuffing a light texture. Avoid undercooked potatoes or very wet mashed potatoes, as these can make the filling difficult to roll."}},{"@type":"Question","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#faq-question-68658629d7f34","name":"How can I fix sticky or dry dough?","acceptedAnswer":{"@type":"Answer","text":"If the dough feels too sticky, add a few tablespoons of whole wheat flour and knead again. Keep in mind that slight stickiness may disappear as you continue kneading and the flour absorbs the water.<br><br>If the dough feels dry or firm, add water a little at a time and knead until it becomes soft and pliable."}}]}],"@id":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#richSnippet","isPartOf":{"@id":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#webpage"},"image":{"@id":"https://i2.wp.com/www.vegrecipesofindia.com/wp-content/uploads/2022/11/aloo-paratha-recipe-2.jpg"},"inLanguage":"en-US","mainEntityOfPage":{"@id":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#webpage"}},{"@type":"Recipe","name":"Aloo Paratha Recipe (Stuffed Potato Paratha)","author":{"@type":"Person","name":"Dassana Amit"},"description":"Aloo Paratha is a popular Punjabi breakfast made with unleavened whole wheat flatbread stuffed with a spiced, tangy mashed potato filling. The stuffed paratha is rolled out and cooked on a tawa or skillet/griddle with oil or ghee until crisp and golden. It is best served with yogurt, butter, or mango or lemon pickle. This aloo ka paratha is made using my tried and tested family recipe.","datePublished":"2022-11-01T23:03:12+00:00","image":["https://www.vegrecipesofindia.com/wp-content/uploads/2009/08/aloo-paratha-recipe-2.jpg","https://www.vegrecipesofindia.com/wp-content/uploads/2009/08/aloo-paratha-recipe-2-500x500.jpg","https://www.vegrecipesofindia.com/wp-content/uploads/2009/08/aloo-paratha-recipe-2-500x375.jpg","https://www.vegrecipesofindia.com/wp-content/uploads/2009/08/aloo-paratha-recipe-2-480x270.jpg"],"recipeYield":["10","10 Aloo Paratha"],"prepTime":"PT20M","cookTime":"PT30M","totalTime":"PT50M","recipeIngredient":["3 to 4  medium potatoes (- boiled and mashed)","1 to 2  green chilies (- chopped finely)","\u00bc to \u00bd teaspoon kashmiri chilli powder (or cayenne pepper or paprika, optional)","\u00bc to \u00bd teaspoon garam masala","\u00bd to 1 teaspoon dry mango powder ((amchur powder))","1 tablespoon finely chopped coriander leaves (- optional)","salt (as required)","oil (or ghee, as required for roasting paratha)","2 cups whole wheat flour ((atta))","\u00bd teaspoon salt (or add as required)","1 tablespoon oil (or ghee (clarified butter))","water (as required for kneading)","white butter (or yogurt to serve with the aloo paratha)","mango pickle (or lemon pickle - as required)"],"recipeInstructions":[{"@type":"HowToSection","name":"Making Potato Stuffing","itemListElement":[{"@type":"HowToStep","text":"First boil the potatoes and peel them. You can boil or steam the potatoes in a pressure cooker, steamer or electric cooker.","name":"First boil the potatoes and peel them. You can boil or steam the potatoes in a pressure cooker, steamer or electric cooker.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-0-0"},{"@type":"HowToStep","text":"Chop and then mash the potatoes with a potato masher.","name":"Chop and then mash the potatoes with a potato masher.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-0-1"},{"@type":"HowToStep","text":"The potatoes should be mashed very well. There should be no lumps or small pieces in it.","name":"The potatoes should be mashed very well. There should be no lumps or small pieces in it.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-0-2"},{"@type":"HowToStep","text":"Now add the chopped green chilies, garam masala powder, red chili powder, dry mango powder and salt.","name":"Now add the chopped green chilies, garam masala powder, red chili powder, dry mango powder and salt.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-0-3"},{"@type":"HowToStep","text":"Mix the spice powders and green chilies with the mashed potatoes very well. Check the taste and add more salt or red chili powder or dry mango powder as per your taste.&nbsp;","name":"Mix the spice powders and green chilies with the mashed potatoes very well. Check the taste and add more salt or red chili powder or dry mango powder as per your taste.&nbsp;","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-0-4"}]},{"@type":"HowToSection","name":"Kneading Dough","itemListElement":[{"@type":"HowToStep","text":"In another bowl or pan, take whole wheat flour (atta).&nbsp;","name":"In another bowl or pan, take whole wheat flour (atta).&nbsp;","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-1-0"},{"@type":"HowToStep","text":"Make a well in the center. Add salt, oil and about half of the water.","name":"Make a well in the center. Add salt, oil and about half of the water.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-1-1"},{"@type":"HowToStep","text":"Bring the mixture together and knead into a smooth soft dough.&nbsp;","name":"Bring the mixture together and knead into a smooth soft dough.&nbsp;","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-1-2"},{"@type":"HowToStep","text":"Cover and keep the dough aside for 20 to 30 minutes.","name":"Cover and keep the dough aside for 20 to 30 minutes.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-1-3"}]},{"@type":"HowToSection","name":"Method 1","itemListElement":[{"@type":"HowToStep","text":"Pinch two small balls from the dough. Flatten them and dust with whole wheat flour.","name":"Pinch two small balls from the dough. Flatten them and dust with whole wheat flour.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-3-0"},{"@type":"HowToStep","text":"With a rolling pin, roll them into about 4 to 5 inches diameter rounds. Try making both the rounds of the same size.","name":"With a rolling pin, roll them into about 4 to 5 inches diameter rounds. Try making both the rounds of the same size.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-3-1"},{"@type":"HowToStep","text":"On one of the rolled dough circle, place the potato stuffing in the center and keep about 1 inch empty space from the sides.","name":"On one of the rolled dough circle, place the potato stuffing in the center and keep about 1 inch empty space from the sides.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-3-2"},{"@type":"HowToStep","text":"Gently place the second circle on top.","name":"Gently place the second circle on top.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-3-3"},{"@type":"HowToStep","text":"Press and seal the edges with your fingertips.","name":"Press and seal the edges with your fingertips.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-3-4"},{"@type":"HowToStep","text":"Dust some flour on the stuffed paratha and roll into a round of about 7 to 8 inches in diameter or about the size of a normal roti or chapati.","name":"Dust some flour on the stuffed paratha and roll into a round of about 7 to 8 inches in diameter or about the size of a normal roti or chapati.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-3-5"}]},{"@type":"HowToSection","name":"Method 2","itemListElement":[{"@type":"HowToStep","text":"Pinch a medium ball dough. Roll and flatten it. Dust with some flour and roll it in a circle of about 5 to 5.5 inches in diameter.","name":"Pinch a medium ball dough. Roll and flatten it. Dust with some flour and roll it in a circle of about 5 to 5.5 inches in diameter.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-4-0"},{"@type":"HowToStep","text":"Place the potato stuffing in the center, keeping about 2 to 2.5 inches space from the sides.","name":"Place the potato stuffing in the center, keeping about 2 to 2.5 inches space from the sides.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-4-1"},{"@type":"HowToStep","text":"Take the edge and start pleating as well as bringing the pleats in the center.","name":"Take the edge and start pleating as well as bringing the pleats in the center.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-4-2"},{"@type":"HowToStep","text":"Join the pleats together. The pleats have to be joined well, as otherwise there will be gaps while rolling and the filling comes out.&nbsp;","name":"Join the pleats together. The pleats have to be joined well, as otherwise there will be gaps while rolling and the filling comes out.&nbsp;","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-4-3"},{"@type":"HowToStep","text":"In case you do see the filling, then just take a small piece of dough and cover the gap. Roll to smoothen out the small piece of dough.","name":"In case you do see the filling, then just take a small piece of dough and cover the gap. Roll to smoothen out the small piece of dough.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-4-4"},{"@type":"HowToStep","text":"Press the pleats from center.","name":"Press the pleats from center.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-4-5"},{"@type":"HowToStep","text":"Sprinkle some flour and roll this version of aloo paratha to about the same size as that of a chapati or roti.","name":"Sprinkle some flour and roll this version of aloo paratha to about the same size as that of a chapati or roti.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-4-6"}]},{"@type":"HowToSection","name":"Roasting &amp; Making Aloo Paratha","itemListElement":[{"@type":"HowToStep","text":"On a hot tava (tawa or skillet or griddle) place the rolled aloo paratha.","name":"On a hot tava (tawa or skillet or griddle) place the rolled aloo paratha.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-0"},{"@type":"HowToStep","text":"The tawa or skillet be hot and not at a low temperature. Cooking parathas at a low flame will harden them. Parathas ideally are crisp as well as soft.","name":"The tawa or skillet be hot and not at a low temperature. Cooking parathas at a low flame will harden them. Parathas ideally are crisp as well as soft.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-1"},{"@type":"HowToStep","text":"When the base is partly cooked, flip the alu paratha using a spatula or tongs.","name":"When the base is partly cooked, flip the alu paratha using a spatula or tongs.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-2"},{"@type":"HowToStep","text":"Spread some ghee on the partly cooked part.","name":"Spread some ghee on the partly cooked part.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-3"},{"@type":"HowToStep","text":"Flip again and this time this side has to be cooked more than the previous side. You will see brown spots on the aloo paratha.","name":"Flip again and this time this side has to be cooked more than the previous side. You will see brown spots on the aloo paratha.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-4"},{"@type":"HowToStep","text":"Spread some ghee on this side too. A well made and well roasted aloo paratha will puff up.","name":"Spread some ghee on this side too. A well made and well roasted aloo paratha will puff up.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-5"},{"@type":"HowToStep","text":"Flip again once or twice till both the sides of aloo paratha are cooked properly. You should see crisp brown spots on the aloo paratha.\u00a0","name":"Flip again once or twice till both the sides of aloo paratha are cooked properly. You should see crisp brown spots on the aloo paratha.\u00a0","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-6"},{"@type":"HowToStep","text":"You can also press the paratha edges with a spatula or spoon, so that they are fried well. As some time, the paratha edges are not cooked well so keep this point in mind.\u00a0","name":"You can also press the paratha edges with a spatula or spoon, so that they are fried well. As some time, the paratha edges are not cooked well so keep this point in mind.\u00a0","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-7"},{"@type":"HowToStep","text":"Make all aloo ke parathe this way and stack them up in a roti basket or casserole.","name":"Make all aloo ke parathe this way and stack them up in a roti basket or casserole.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-8"},{"@type":"HowToStep","text":"You can also serve the aloo paratha directly from the tawa (skillet) straight in the serving plate. Serve some extra butter on the side, along with mango pickle or lemon pickle or garlic pickle or some yogurt.","name":"You can also serve the aloo paratha directly from the tawa (skillet) straight in the serving plate. Serve some extra butter on the side, along with mango pickle or lemon pickle or garlic pickle or some yogurt.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-9"},{"@type":"HowToStep","text":"If you are serving aloo paratha as an evening snack then you can also serve them with a cup of hot chai or lassi.","name":"If you are serving aloo paratha as an evening snack then you can also serve them with a cup of hot chai or lassi.","url":"https://www.vegrecipesofindia.com/aloo-paratha-indian-bread-stuffed-with-potato-filling/#wprm-recipe-134382-step-5-10"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.9","ratingCount":"104","reviewCount":"9"},"review":[{"@type":"Review","reviewRating"
