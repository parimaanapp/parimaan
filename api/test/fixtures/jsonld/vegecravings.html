n pastries with a spiced potato filling. Deep-fry them the classic way or air-fry or bake for a healthier version.","breadcrumb":{"@id":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#breadcrumb"},"inLanguage":"en-US","potentialAction":[{"@type":"ReadAction","target":["https:\/\/vegecravings.com\/punjabi-samosa-recipe\/"]}]},{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#primaryimage","url":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions.jpg","contentUrl":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions.jpg","width":2087,"height":1881,"caption":"Aloo Samosa Recipe Step By Step Instructions"},{"@type":"BreadcrumbList","@id":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https:\/\/vegecravings.com\/"},{"@type":"ListItem","position":2,"name":"Recipes","item":"https:\/\/vegecravings.com\/category\/recipes\/"},{"@type":"ListItem","position":3,"name":"Snacks","item":"https:\/\/vegecravings.com\/category\/recipes\/snacks\/"},{"@type":"ListItem","position":4,"name":"Samosa Recipe | Punjabi Aloo Samosa"}]},{"@type":"WebSite","@id":"https:\/\/vegecravings.com\/#website","url":"https:\/\/vegecravings.com\/","name":"VegeCravings","description":"Authentic Indian Vegetarian Recipes","publisher":{"@id":"https:\/\/vegecravings.com\/#\/schema\/person\/5e42b8410db5f45b4ec64445cbdc0278"},"potentialAction":[{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https:\/\/vegecravings.com\/?s={search_term_string}"},"query-input":{"@type":"PropertyValueSpecification","valueRequired":true,"valueName":"search_term_string"}}],"inLanguage":"en-US"},{"@type":["Person","Organization"],"@id":"https:\/\/vegecravings.com\/#\/schema\/person\/5e42b8410db5f45b4ec64445cbdc0278","name":"VegeCravings","image":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/vegecravings.com\/wp-content\/uploads\/2016\/02\/vegecravings-logo.png","url":"https:\/\/vegecravings.com\/wp-content\/uploads\/2016\/02\/vegecravings-logo.png","contentUrl":"https:\/\/vegecravings.com\/wp-content\/uploads\/2016\/02\/vegecravings-logo.png","width":756,"height":708,"caption":"VegeCravings"},"logo":{"@id":"https:\/\/vegecravings.com\/wp-content\/uploads\/2016\/02\/vegecravings-logo.png"},"description":"This website began with my desire to recreate &amp; document cherished home-cooked recipes, evolving into a collection of delicious vegetarian dishes from India &amp; around the globe. Each recipe on VegeCravings is either a treasured family recipe or meticulously tested by me. These are the recipes I turn to when cooking for myself, and I hope they become your go-to favorites as well.","sameAs":["http:\/\/vegecravings.com","https:\/\/www.facebook.com\/vegecravings\/","https:\/\/www.instagram.com\/vegecravings\/","https:\/\/in.pinterest.com\/vegecravings\/","https:\/\/x.com\/vegecravings","https:\/\/www.youtube.com\/channel\/UCzCQWICGYp7WUvVHTYHGTOA"],"publishingPrinciples":"https:\/\/vegecravings.com\/about\/","actionableFeedbackPolicy":"https:\/\/vegecravings.com\/contact-us\/"},{"@type":"Recipe","name":"Samosa Recipe | Punjabi Aloo Samosa","author":{"@type":"Person","name":"VegeCravings"},"description":"Samosas are flaky, golden pastries with a spiced potato filling. Deep-fry them the classic way or air-fry or bake for a healthier version.","datePublished":"2025-02-24T14:28:21+00:00","image":["https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions.jpg","https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-500x500.jpg","https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-500x375.jpg","https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-480x270.jpg"],"recipeYield":["14"],"prepTime":"PT30M","cookTime":"PT50M","totalTime":"PT60M","recipeIngredient":["2 Cups All Purpose Flour (Maida)","1 Teaspoon Ajwain (Carom Seeds)","2 Tablespoon Ghee (Clarified Butter)","1 Teaspoon Salt","3 Medium Sized Potato","1 Cup Green Peas (Matar)","2 Inch Piece of Ginger","1-2  Green Chillies","1 Teaspoon Cumin Seeds (Jeera)","1\/8 Teaspoon Heeng (Asafoetida)","1\/2 Teaspoon Turmeric Powder (Haldi)","1 Teaspoon Red Chilli Powder","1 Teaspoon Coriander Powder (Dhaniya Powder)","1\/2 Teaspoon Garam Masala","1 Teaspoon Amchur (Dry Mango Powder)","1\/2 Teaspoon Fennel Seeds (Saunf)","1\/2 Teaspoon Crushed Anardana","1 Teaspoon Salt","1 Tablespoon Cooking Oil","2 Cups Cooking Oil"],"recipeInstructions":[{"@type":"HowToSection","name":"Preparing the pastry","itemListElement":[{"@type":"HowToStep","text":"Combine all purpose flour (maida), salt and carom seeds (ajwain) in a bowl.","name":"Combine all purpose flour (maida), salt and carom seeds (ajwain) in a bowl.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-0-0","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-2-scaled.jpg"},{"@type":"HowToStep","text":"Add ghee or oil to the flour.","name":"Add ghee or oil to the flour.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-0-1","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-3-scaled.jpg"},{"@type":"HowToStep","text":"Mix the ghee with the flour rubbing it between both hands to coat the flour completely. The texture of the coated flour should resemble breadcrumbs and it should be able to hold it&#39;s shape when you press it in your hands.","name":"Mix the ghee with the flour rubbing it between both hands to coat the flour completely. The texture of the coated flour should resemble breadcrumbs and it should be able to hold it&#39;s shape when you press it in your hands.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-0-2","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-4-scaled.jpg"},{"@type":"HowToStep","text":"Add around 1\/2 cup of water to the dough slowly and knead to make a firm stiff dough. Brush with a thin layer of oil and let it rest covered for 20-30 mins.","name":"Add around 1\/2 cup of water to the dough slowly and knead to make a firm stiff dough. Brush with a thin layer of oil and let it rest covered for 20-30 mins.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-0-3","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-5-scaled.jpg"}]},{"@type":"HowToSection","name":"Preparing the stuffing","itemListElement":[{"@type":"HowToStep","text":"Heat oil in a pan on medium heat and add cumin seeds (jeera) and heeng (asafoetida). Roast for 30 seconds till they start to splutter.","name":"Heat oil in a pan on medium heat and add cumin seeds (jeera) and heeng (asafoetida). Roast for 30 seconds till they start to splutter.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-1-0","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-6-scaled.jpg"},{"@type":"HowToStep","text":"Add grated ginger and finely chopped green chillies to the pan. Fry for 30-60 seconds.","name":"Add grated ginger and finely chopped green chillies to the pan. Fry for 30-60 seconds.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-1-1","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-7-scaled.jpg"},{"@type":"HowToStep","text":"Then add green peas to the pan. You can add fresh boiled peas or frozen peas.","name":"Then add green peas to the pan. You can add fresh boiled peas or frozen peas.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-1-2","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-8-scaled.jpg"},{"@type":"HowToStep","text":"Add turmeric powder, red chilli powder, coriander powder, garam masala, dry mango powder (amchur) and salt. I have also added some fennel seeds and crushed anardana, but they are optional","name":"Add turmeric powder, red chilli powder, coriander powder, garam masala, dry mango powder (amchur) and salt. I have also added some fennel seeds and crushed anardana, but they are optional","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-1-3","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-9-scaled.jpg"},{"@type":"HowToStep","text":"Mash the boiled potatoes coarsely and add them to the pan.","name":"Mash the boiled potatoes coarsely and add them to the pan.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-1-4","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-10-scaled.jpg"},{"@type":"HowToStep","text":"Stir to mix all the ingredients well. Set the prepared stuffing aside.","name":"Stir to mix all the ingredients well. Set the prepared stuffing aside.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-1-5","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-11-scaled.jpg"}]},{"@type":"HowToSection","name":"Preparing the samosas","itemListElement":[{"@type":"HowToStep","text":"Divide the dough into lemon sized balls.","name":"Divide the dough into lemon sized balls.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-0","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-12-scaled.jpg"},{"@type":"HowToStep","text":"Flatten it to a disk with the help of a rolling pin. The disc should not be too thick.","name":"Flatten it to a disk with the help of a rolling pin. The disc should not be too thick.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-1","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-13-scaled.jpg"},{"@type":"HowToStep","text":"Then cut the disc into two semi circles with a knife.","name":"Then cut the disc into two semi circles with a knife.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-2","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-14-scaled.jpg"},{"@type":"HowToStep","text":"Brush a little water on the edges of the pastry. This will help the dough stick together.","name":"Brush a little water on the edges of the pastry. This will help the dough stick together.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-3","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-15-scaled.jpg"},{"@type":"HowToStep","text":"Fold the semicircle to make a hollow cone and lightly pinch the 2 edges to join.","name":"Fold the semicircle to make a hollow cone and lightly pinch the 2 edges to join.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-4","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-16-scaled.jpg"},{"@type":"HowToStep","text":"Hold the cone in your hand as shown.","name":"Hold the cone in your hand as shown.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-5","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-17-scaled.jpg"},{"@type":"HowToStep","text":"Stuff the samosas with around 2 spoons of the potato and peas filling, gently pressing to leave no air pockets. Leave half an inch of space at the edges.","name":"Stuff the samosas with around 2 spoons of the potato and peas filling, gently pressing to leave no air pockets. Leave half an inch of space at the edges.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-6","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-18.jpg"},{"@type":"HowToStep","text":"Seal the edges of the samosa by pinching it between your fingers. Prepare all the samosas this way. Keep them covered with a damp cloth to prevent them from drying while making.","name":"Seal the edges of the samosa by pinching it between your fingers. Prepare all the samosas this way. Keep them covered with a damp cloth to prevent them from drying while making.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-2-7","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-19-scaled.jpg"}]},{"@type":"HowToSection","name":"Deep-frying the samosas","itemListElement":[{"@type":"HowToStep","text":"Heat oil in a pan at low-medium heat and gently drop the samosas in the hot oil in batches.","name":"Heat oil in a pan at low-medium heat and gently drop the samosas in the hot oil in batches.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-3-0","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-20-1.jpg"},{"@type":"HowToStep","text":"Fry them for 8-10 minutes or till they are golden and crispy. Then take them out and drain them on an absorbent paper.","name":"Fry them for 8-10 minutes or till they are golden and crispy. Then take them out and drain them on an absorbent paper.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-3-1","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-21-1.jpg"}]},{"@type":"HowToSection","name":"Baking the samosas in oven","itemListElement":[{"@type":"HowToStep","text":"Line a tray with foil and brush it with oil. Then arrange the samosas on the tray so that they are not touching and brush them with some oil as well.","name":"Line a tray with foil and brush it with oil. Then arrange the samosas on the tray so that they are not touching and brush them with some oil as well.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-4-0","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-24-scaled.jpg"},{"@type":"HowToStep","text":"Bake at 375℉ or 190℃  for 30-35 minutes, till they are crispy and golden brown. Flip them halfway through while baking for even baking.","name":"Bake at 375℉ or 190℃  for 30-35 minutes, till they are crispy and golden brown. Flip them halfway through while baking for even baking.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-4-1","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-25-scaled.jpg"}]},{"@type":"HowToSection","name":"Air-frying the samosas","itemListElement":[{"@type":"HowToStep","text":"Place the samosas in an air fryer basket and brush them with some oil. Do not overcrowd the basket.","name":"Place the samosas in an air fryer basket and brush them with some oil. Do not overcrowd the basket.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-5-0","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-22-scaled.jpg"},{"@type":"HowToStep","text":"Air fry them at 375℉ or 190℃ for 15-18 minutes or till crispy. Flip them in between at around 10 minutes to cook them evenly.","name":"Air fry them at 375℉ or 190℃ for 15-18 minutes or till crispy. Flip them in between at around 10 minutes to cook them evenly.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-5-1","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions-23-scaled.jpg"},{"@type":"HowToStep","text":"Samosas are ready. Serve them piping hot along with mint chutney, coriander chutney or tamarind chutney.","name":"Samosas are ready. Serve them piping hot along with mint chutney, coriander chutney or tamarind chutney.","url":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#wprm-recipe-20983-step-5-2","image":"https:\/\/vegecravings.com\/wp-content\/uploads\/2017\/03\/Aloo-Samosa-Recipe-Step-By-Step-Instructions.jpg"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.89","ratingCount":"80"},"recipeCategory":["Snacks"],"recipeCuisine":["Indian"],"suitableForDiet":["https:\/\/schema.org\/VeganDiet","https:\/\/schema.org\/VegetarianDiet"],"keywords":"Diwali Recipes, Holi Recipes, Indian Dinner Party Menu Ideas, indian street food, Potatoes, Tea Time Snacks, Vegan","nutrition":{"@type":"NutritionInformation","calories":"284 kcal","carbohydrateContent":"24 g","proteinContent":"4 g","fatContent":"20 g","fiberContent":"3 g","servingSize":"1 serving"},"@id":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#recipe","isPartOf":{"@id":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/#article"},"mainEntityOfPage":"https:\/\/vegecravings.com\/punjabi-samosa-recipe\/"}]}</script>
