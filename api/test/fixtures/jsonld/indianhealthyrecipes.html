ehind Swasthi's Recipes. My aim is to help you cook great Indian food with my time-tested recipes. After 2 decades of experience in practical Indian cooking I started this blog to help people cook better &amp; more often at home. Whether you are a novice or an experienced cook I am sure Swasthi’s Recipes will assist you to enhance your cooking skills. Read more.."},{"@type":"Question","@id":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536762578","position":1,"url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536762578","name":"Is paneer butter masala good for health?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"It is a high calorie dish so enjoy this occasionally &amp; moderately. Serve it with healthier options like whole wheat roti, chapatti, phulka, tandoori roti or steamed rice.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536782099","position":2,"url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536782099","name":"What is butter paneer?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"It is just another name for paneer butter masala. Since paneer is cooked in a buttery masala (masala that is cooked in butter) it is also called as butter paneer.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536808502","position":3,"url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536808502","name":"Can we add milk instead of cream in paneer butter masala?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Unfortunately more often milk curdles when cooked with acidic ingredients like tomatoes. So instead use more cashews in the recipe and skip cream.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536839779","position":4,"url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536839779","name":"What is the substitute for cream in paneer butter masala?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"To get the exact taste of cream, substitute it with cashew cream. To make your own, soak 15 cashew nuts in warm water for an hour and blend it until creamy, smooth and thick. Add this at the last step after you turn off the stove.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536865883","position":5,"url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536865883","name":"What is the difference between paneer butter masala and paneer tikka masala?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Paneer butter masala is essentially cooked in butter, has a smooth silky curry to which raw paneer is added. But paneer tikka masala is made with grilled paneer and is predominantly spicy and has some texture in the curry.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536891483","position":6,"url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536891483","name":"Can we fry paneer?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Yes you can fry it in a tablespoon of oil until golden &amp; drop them to a bowl of water. This helps them to remain soft. But frying won’t add any taste to the paneer.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536916986","position":7,"url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#faq-question-1608536916986","name":"Why is my paneer rubbery?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Overcooking paneer makes it rubbery. Just add it to hot gravy and cook no further. Keep the pan covered so the paneer cooks in the residual heat. Also do not leave your paneer curry on the hot burner as it continues to cook.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Recipe","name":"Paneer Butter Masala Recipe","author":{"@id":"https:\/\/www.indianhealthyrecipes.com\/#\/schema\/person\/2d7d264cdc5dc6602ee06a087cd3fcb0"},"description":"This paneer butter masala is a curry lover’s dream!! Soft paneer is dunked in a creamy, silky, super flavorful and delicious curry. My easy paneer recipe will help you make the best butter paneer that tastes better than anything from a restaurant. Make this once, I am sure you will never order it in a restaurant. Serve it with butter naan, roti or Basmati rice.","datePublished":"2020-12-21T06:56:00+00:00","image":["https:\/\/www.indianhealthyrecipes.com\/wp-content\/uploads\/2014\/11\/paneer-butter-masala-recipe-2.jpg","https:\/\/www.indianhealthyrecipes.com\/wp-content\/uploads\/2014\/11\/paneer-butter-masala-recipe-2-500x500.jpg","https:\/\/www.indianhealthyrecipes.com\/wp-content\/uploads\/2014\/11\/paneer-butter-masala-recipe-2-500x375.jpg","https:\/\/www.indianhealthyrecipes.com\/wp-content\/uploads\/2014\/11\/paneer-butter-masala-recipe-2-480x270.jpg"],"video":{"name":"Paneer Butter Masala","description":"Find the written recipe on our website -","uploadDate":"2025-08-19T08:35:02+00:00","duration":"PT1M16S","thumbnailUrl":"https:\/\/i.ytimg.com\/vi\/U56cWrIr6xg\/hqdefault.jpg","embedUrl":"https:\/\/www.youtube.com\/embed\/U56cWrIr6xg?feature=oembed","contentUrl":"https:\/\/www.youtube.com\/watch?v=U56cWrIr6xg","@type":"VideoObject"},"recipeYield":["4"],"prepTime":"PT15M","cookTime":"PT30M","totalTime":"PT40M","recipeIngredient":["1 tablespoon (15 ml)  oil","2  green cardamoms ( (or ¼ to ⅓ tsp ground cardamom, elaichi))","1 cup (130 grams)  onions  ((sliced or diced from 1 medium yellow or 2 small red onions))","1 inch (10 grams)   ginger  ((peeled &amp; sliced or use 1½ to 2 teaspoon ginger garlic paste, read notes))","5 to 6 (12 grams)  large  garlic cloves  ((peeled, omit to use gg paste))","2 cups (350 grams)  tomatoes  ((sliced, use up to 420 grams from 2 large or 4 medium))","15 (30 grams)  whole cashew nuts  ((use up to 18 nuts\/ 36 g if using more tomatoes or use almonds))","1 teaspoon sea salt ( (adjust to taste))","1 teaspoon jaggery\/ sugar ( (optional))","¾ to 1 teaspoon Kashmiri red chilli powder ((or paprika) (adjust to heat &amp; color preference))","¾ to 1 teaspoon garam masala ( (adjust to taste))","1 teaspoon coriander powder  ((daniya powder) (optional))","1 cup (240 ml)  cold water  ((to blend))","2 tablespoons (30 grams)  unsalted butter","1 small  bay leaf ((tej patta, optional))","2 inch Ceylon cinnamon piece ((or 1 inch dalchini, optional))","3  cloves ((laung, optional))","250 to 300 grams (9 to 10 oz)  paneer  ((I cut mine to ¾ inch))","½ tablespoon kasuri methi ( (dried fenugreek leaves, crushed))","3 to 4 tablespoons  (45 to 60 ml)   heavy cream ((sub with fresh cream, cooking cream or thickened cream))","1 to 2 tablespoon coriander leaves ( (cilantro finely chopped, to garnish))"],"recipeInstructions":[{"@type":"HowToSection","name":"To saute & puree","itemListElement":[{"@type":"HowToStep","text":"Pour oil to a pan and add cardamoms, onions, ginger and garlic. Saute for 4 to 5 mins, until the onions turn transparent.","name":"Pour oil to a pan and add cardamoms, onions, ginger and garlic. Saute for 4 to 5 mins, until the onions turn transparent.","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-0-0"},{"@type":"HowToStep","text":"Add tomatoes, salt and cashews. Mix well and cook covered until the tomatoes turn mushy and break down. (Takes me about 7 mins on a medium heat. If your pan is dry, add a splash of water).","name":"Add tomatoes, salt and cashews. Mix well and cook covered until the tomatoes turn mushy and break down. (Takes me about 7 mins on a medium heat. If your pan is dry, add a splash of water).","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-0-1"},{"@type":"HowToStep","text":"Stir in the red chili powder, coriander powder and garam masala. Saute on a medium heat for 3 to 4 mins, until aromatic. Turn off and cool down.","name":"Stir in the red chili powder, coriander powder and garam masala. Saute on a medium heat for 3 to 4 mins, until aromatic. Turn off and cool down.","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-0-2"},{"@type":"HowToStep","text":"Pour 1 cup cold water to a blender jar & transfer the onion tomato masala. Blend to a silky smooth puree.","name":"Pour 1 cup cold water to a blender jar & transfer the onion tomato masala. Blend to a silky smooth puree.","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-0-3"}]},{"@type":"HowToSection","name":"Make Paneer Butter Masala","itemListElement":[{"@type":"HowToStep","text":"On a low heat, melt butter in the same pan and add the optional whole spices if using – bay leaf, cinnamon and cloves.","name":"On a low heat, melt butter in the same pan and add the optional whole spices if using – bay leaf, cinnamon and cloves.","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-1-0"},{"@type":"HowToStep","text":"When they begin to sizzle, stir in the optional red chili powder. Hold a strainer over the pan and pour the onion tomato masala. Stir with a spoon to strain.","name":"When they begin to sizzle, stir in the optional red chili powder. Hold a strainer over the pan and pour the onion tomato masala. Stir with a spoon to strain.","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-1-1"},{"@type":"HowToStep","text":"Pour ½ cup more water &amp; mix well. Cook covered on a medium heat until slightly thick, yet flowy. It will thicken upon cooling.  (Takes about 10 to 12 mins, keep stirring every 3 to 4 mins). You will see traces of fat on the butter masala when it is ready.","name":"Pour ½ cup more water &amp; mix well. Cook covered on a medium heat until slightly thick, yet flowy. It will thicken upon cooling.  (Takes about 10 to 12 mins, keep stirring every 3 to 4 mins). You will see traces of fat on the butter masala when it is ready.","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-1-2"},{"@type":"HowToStep","text":"Remove the whole spices to discard and taste test to adjust salt and garam masala. Stir in the jaggery, kasuri methi &amp; paneer. Cook covered for 2 to 3 mins on a low heat and turn off. Stir in the cream (reserve a tablespoon to garnish).","name":"Remove the whole spices to discard and taste test to adjust salt and garam masala. Stir in the jaggery, kasuri methi &amp; paneer. Cook covered for 2 to 3 mins on a low heat and turn off. Stir in the cream (reserve a tablespoon to garnish).","url":"https:\/\/www.indianhealthyrecipes.com\/paneer-butter-masala-restaurant-style\/#wprm-recipe-38268-step-1-3"},{"@type":"HowToStep","text":"Garnish paneer butter masala with cream and chopped coriander leaves. Best served with Basmati Rice, Jeera Rice, Butter Naan, Tandoori Roti or plain parathas.","name":"Garnish paneer butter masala with cream and chopped coriander leaves. Best served with Basmati Rice, Jeera Rice, Butter Naan, Tandoo
