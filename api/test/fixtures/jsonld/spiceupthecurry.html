-Up-The-Curry-300x300-1.png","width":300,"height":300,"caption":"Spice Up The Curry"},"image":{"@id":"https:\/\/www.spiceupthecurry.com\/#\/schema\/logo\/image\/"},"sameAs":["https:\/\/www.facebook.com\/spiceupthecurry","https:\/\/x.com\/spiceupthecurry","https:\/\/www.instagram.com\/spice.up.the.curry\/","https:\/\/www.pinterest.com\/spiceupthecurry\/"]},{"@type":"Person","@id":"https:\/\/www.spiceupthecurry.com\/#\/schema\/person\/7176dac20eedfa98c91ae21b173f4575","name":"Kanan Patel","image":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/secure.gravatar.com\/avatar\/8101c56fddf31a6ea42894bad5db9aef4dc4e030e989ae3fc95bba213f7acf0a?s=96&d=blank&r=g","url":"https:\/\/secure.gravatar.com\/avatar\/8101c56fddf31a6ea42894bad5db9aef4dc4e030e989ae3fc95bba213f7acf0a?s=96&d=blank&r=g","contentUrl":"https:\/\/secure.gravatar.com\/avatar\/8101c56fddf31a6ea42894bad5db9aef4dc4e030e989ae3fc95bba213f7acf0a?s=96&d=blank&r=g","caption":"Kanan Patel"},"description":"To understand the art and science of cooking, I’ve read many cookbooks and culinary books—and now I’m sharing all that experience with you. I started this blog in 2012 to share reliable vegetarian, Indian, and eggless baking recipes (with step-by-step photos and videos) that you can count on.","sameAs":["https:\/\/www.spiceupthecurry.com\/about\/"]},{"@type":"Recipe","name":"Pesarattu Recipe (Green Moong Dosa)","author":{"@id":"https:\/\/www.spiceupthecurry.com\/#\/schema\/person\/7176dac20eedfa98c91ae21b173f4575"},"description":"Crispy, protein-rich Pesarattu — the famous Andhra green moong dosa with no fermentation needed. Soak overnight, grind, cook. Ready in 20 minutes!","datePublished":"2026-05-19T11:41:09+00:00","image":["https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-recipe-1.jpg","https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-recipe-1-500x500.jpg","https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-recipe-1-500x375.jpg","https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-recipe-1-480x270.jpg"],"recipeYield":["8","8 (15-16 dosa)"],"prepTime":"PT490M","cookTime":"PT20M","totalTime":"PT510M","recipeIngredient":["1 cup Whole green moong dal (Green gram dal)","2 tablespoons Sona masoori rice (long grain rice works as well)","½ inch Ginger","2-3  Green chilies","½ teaspoon Cumin seeds","¼ teaspoon Hing (Asafoetida)","1 teaspoon Salt (or to taste)","1 cup Water (for grinding)","Oil (to cook pesarattu)"],"recipeInstructions":[{"@type":"HowToStep","text":"Wash &amp; Soak: Add the whole green moong dal and rice to a large bowl. Wash 2–3 times, rubbing the grains together, until the water runs mostly clear. Drain.Soak in enough water (2-3 inches above the lentils) for 6–8 hours or overnight. The moong will swell to nearly double its size. 💡 TIP: Do not soak for less than 6 hours — under-soaked moong doesn&#39;t grind smoothly.","name":"Wash &amp; Soak: Add the whole green moong dal and rice to a large bowl. Wash 2–3 times, rubbing the grains together, until the water runs mostly clear. Drain.Soak in enough water (2-3 inches above the lentils) for 6–8 hours or overnight. The moong will swell to nearly double its size. 💡 TIP: Do not soak for less than 6 hours — under-soaked moong doesn&#39;t grind smoothly.","url":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#wprm-recipe-83982-step-0-0","image":"https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-step-1.jpg"},{"@type":"HowToStep","text":"Grind the Batter: Drain all the soaking water completely. Transfer the soaked moong and rice to a blender jar. Add the ginger, green chilies, cumin seeds, hing, and salt. Add ¾-1 cup fresh water and blend until smooth. Pour into a bowl. 💡 TIP: Discard the soaking water and grind with fresh water. Soaking water contains the oligosaccharides (complex sugars) leached from the moong that can create bloating. Fresh water gives you a cleaner-tasting, easier-to-digest pesarattu.","name":"Grind the Batter: Drain all the soaking water completely. Transfer the soaked moong and rice to a blender jar. Add the ginger, green chilies, cumin seeds, hing, and salt. Add ¾-1 cup fresh water and blend until smooth. Pour into a bowl. 💡 TIP: Discard the soaking water and grind with fresh water. Soaking water contains the oligosaccharides (complex sugars) leached from the moong that can create bloating. Fresh water gives you a cleaner-tasting, easier-to-digest pesarattu.","url":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#wprm-recipe-83982-step-0-1","image":"https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-step-2.jpg"},{"@type":"HowToStep","text":"Check Batter Consistency: The batter should be a medium-thick, pourable consistency — like regular dosa batter.Taste and adjust salt if needed. No resting time required — cook immediately.","name":"Check Batter Consistency: The batter should be a medium-thick, pourable consistency — like regular dosa batter.Taste and adjust salt if needed. No resting time required — cook immediately.","url":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#wprm-recipe-83982-step-0-2","image":"https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-step-3.jpg"},{"@type":"HowToStep","text":"Heat the Tawa: Place a cast iron tawa or heavy flat pan on medium heat. Let it heat properly — this takes 3–5 minutes for cast iron. The tawa is ready when a drop of water sprinkled on the surface sizzles and evaporates immediately.If this is your first dosa on a freshly cleaned tawa, rub a half-cut onion over the surface or wipe with a paper towel dipped in oil to season it. A well-seasoned tawa needs no additional oil at the start.","name":"Heat the Tawa: Place a cast iron tawa or heavy flat pan on medium heat. Let it heat properly — this takes 3–5 minutes for cast iron. The tawa is ready when a drop of water sprinkled on the surface sizzles and evaporates immediately.If this is your first dosa on a freshly cleaned tawa, rub a half-cut onion over the surface or wipe with a paper towel dipped in oil to season it. A well-seasoned tawa needs no additional oil at the start.","url":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#wprm-recipe-83982-step-0-3"},{"@type":"HowToStep","text":"Pour &amp; Spread: Take approximately ¼ cup (one full ladle) of batter. Pour it onto the center of the hot tawa. Immediately use the back of the ladle to spread it outward in concentric circles. Work quickly.Keep the pesarattu at medium thickness — not paper-thin like a paper dosa, and not thick like an uttapam.","name":"Pour &amp; Spread: Take approximately ¼ cup (one full ladle) of batter. Pour it onto the center of the hot tawa. Immediately use the back of the ladle to spread it outward in concentric circles. Work quickly.Keep the pesarattu at medium thickness — not paper-thin like a paper dosa, and not thick like an uttapam.","url":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#wprm-recipe-83982-step-0-4","image":"https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-step-4.jpg"},{"@type":"HowToStep","text":"Oil, Cook, Flip &amp; Finish: Drizzle a teaspoon of oil around the edges of the pesarattu and a few drops on the top surface. Cook on medium heat. As the pesarattu cooks, you will see the edges start to turn golden and lift away from the tawa — this is your signal that the bottom is cooked.Flip using a flat spatula. Cook the second side for just 30–45 seconds. The second side only needs a brief cook — it doesn&#39;t need to be golden.Remove and serve immediately. Pesarattu is always best hot off the tawa.Repeat with remaining batter, adjusting the heat between dosas if needed.","name":"Oil, Cook, Flip &amp; Finish: Drizzle a teaspoon of oil around the edges of the pesarattu and a few drops on the top surface. Cook on medium heat. As the pesarattu cooks, you will see the edges start to turn golden and lift away from the tawa — this is your signal that the bottom is cooked.Flip using a flat spatula. Cook the second side for just 30–45 seconds. The second side only needs a brief cook — it doesn&#39;t need to be golden.Remove and serve immediately. Pesarattu is always best hot off the tawa.Repeat with remaining batter, adjusting the heat between dosas if needed.","url":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#wprm-recipe-83982-step-0-5","image":"https:\/\/www.spiceupthecurry.com\/wp-content\/uploads\/2026\/05\/pesarattu-step-5.jpg"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"1","reviewCount":"1"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Very tasty and prepared the same at home everybody loved it. Hope to receive more recipes to prepare yummy breakfast for family.","author":{"@type":"Person","name":"Alana"},"datePublished":"2026-05-25"}],"recipeCategory":["Breakfast"],"recipeCuisine":["Andhra","South Indian"],"keywords":"pesarattu recipe","nutrition":{"@type":"NutritionInformation","calories":"174 kcal","carbohydrateContent":"20 g","proteinContent":"6 g","fatContent":"8 g","saturatedFatContent":"1 g","sodiumContent":"334 mg","fiberContent":"5 g","sugarContent":"2 g","unsaturatedFatContent":"7 g","servingSize":"1 serving"},"@id":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#recipe","isPartOf":{"@id":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/#article"},"mainEntityOfPage":"https:\/\/www.spiceupthecurry.com\/pesarattu-recipe\/"}]}</script>
<script type="application/ld+json" class="kadence-faq-schema-graph kadence-faq-schema-graph--kb-faq83971_51735e-30">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name": "&lt;strong&gt;Why is my pesarattu not crispy?&lt;/strong&gt;","acceptedAnswer":{"@type": "Answer","text": "<p>The most common causes:</p><ol>
<li>Batter is too thin — it should be medium-thick, not watery</li>



<li>Tawa is not hot enough before you spread the batter</li>



<li>Not enough oil around the edges</li>



<li>Dosa spread too thick. </li>
</ol><p>Check all four and your next batch will be crispy.</p>"}},{"@type":"Question","name": "&lt;strong&gt;Is pesarattu healthy?&lt;/strong&gt;","acceptedAnswer":{"@type": "Answer","text": "<p>Yes — it is one of the highest-protein Indian breakfasts you can make. Whole moong dal is rich in plant protein, dietary fiber, folate, magnesium, and iron. Unlike regular dosa which is primarily rice-based, pesarattu gets most of its bulk from the moong, making it much more protein-dense. It is naturally gluten-free, vegan, and made without any flour or processing. The addition of hing and cumin specifically supports digestion of the legume.</p>"}},{"@type":"Question","name": "&lt;strong&gt;Can I add onion or coriander to the batter?&lt;/strong&gt;","acceptedAnswer":{"@type": "Answer","text": "<p>Yes — this is a popular variation. Scatter them on top of the spread dosa while it is still wet on the tawa and press them in gently. </p>"}},{"@type":"Question","name": "&lt;strong&gt;Why does the pesarattu stick to the tawa?&lt;/strong&gt;","acceptedAnswer":{"@type": "Answer","text": "<ol>
<li>The tawa not being properly seasoned or hot enough before pouring</li>



<li>Flipping too early before the bottom is fully cooked</li>



<li>Batter that is too thin. </li>
</ol><p>Season a cast iron tawa by rubbing with oil and heating, then wiping clean before the first dosa. Once seasoned, it should not stick.</p>"}}]}</script>
