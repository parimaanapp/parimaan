tes.","breadcrumb":{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#breadcrumb"},"mainEntity":[{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770421631345"},{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770051549965"},{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770346794656"},{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770351445224"},{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770349643757"},{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1771778636535"}],"inLanguage":"en-US","potentialAction":[{"@type":"ReadAction","target":["https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/"]}]},{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#primaryimage","url":"https:\/\/cookilicious.com\/wp-content\/uploads\/2025\/04\/Tomato-Rava-Upma-30-scaled.jpg","contentUrl":"https:\/\/cookilicious.com\/wp-content\/uploads\/2025\/04\/Tomato-Rava-Upma-30-scaled.jpg","width":1707,"height":2560,"caption":"Tomato rava upma served hot in a bowl with vegetables, a classic South Indian breakfast."},{"@type":"BreadcrumbList","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https:\/\/cookilicious.com\/"},{"@type":"ListItem","position":2,"name":"Recipes","item":"https:\/\/cookilicious.com\/recipes\/"},{"@type":"ListItem","position":3,"name":"Breakfasts","item":"https:\/\/cookilicious.com\/category\/breakfasts\/"},{"@type":"ListItem","position":4,"name":"South Indian Tomato Rava Upma Recipe"}]},{"@type":"WebSite","@id":"https:\/\/cookilicious.com\/#website","url":"https:\/\/cookilicious.com\/","name":"Cookilicious","description":"Delicious Vegetarian\/Vegan Cooking!","publisher":{"@id":"https:\/\/cookilicious.com\/#organization"},"potentialAction":[{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https:\/\/cookilicious.com\/?s={search_term_string}"},"query-input":{"@type":"PropertyValueSpecification","valueRequired":true,"valueName":"search_term_string"}}],"inLanguage":"en-US"},{"@type":"Organization","@id":"https:\/\/cookilicious.com\/#organization","name":"Cookilicious","url":"https:\/\/cookilicious.com\/","logo":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/cookilicious.com\/#\/schema\/logo\/image\/","url":"https:\/\/cookilicious.com\/wp-content\/uploads\/2018\/08\/FINAL-PNG-LOGO.png","contentUrl":"https:\/\/cookilicious.com\/wp-content\/uploads\/2018\/08\/FINAL-PNG-LOGO.png","width":960,"height":919,"caption":"Cookilicious"},"image":{"@id":"https:\/\/cookilicious.com\/#\/schema\/logo\/image\/"},"sameAs":["http:\/\/facebook.com\/cookliciousveg","https:\/\/x.com\/cookiliciousveg","https:\/\/instagram.com\/cookilicious\/","https:\/\/www.pinterest.com\/cookiliciousveg\/","https:\/\/www.youtube.com\/channel\/UCDnOw9Dqi_9LFLXu0dYnb2A"]},{"@type":"Person","@id":"https:\/\/cookilicious.com\/#\/schema\/person\/8f403b7fc4de937adb8a1069e8da27e4","name":"Priya Lakshminarayan","image":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/secure.gravatar.com\/avatar\/89d556f758e10c233d4b2270c3d06c118585918871e6652a1130507e970a2852?s=96&d=mm&r=g","url":"https:\/\/secure.gravatar.com\/avatar\/89d556f758e10c233d4b2270c3d06c118585918871e6652a1130507e970a2852?s=96&d=mm&r=g","contentUrl":"https:\/\/secure.gravatar.com\/avatar\/89d556f758e10c233d4b2270c3d06c118585918871e6652a1130507e970a2852?s=96&d=mm&r=g","caption":"Priya Lakshminarayan"},"sameAs":["https:\/\/cookilicious.com\/meet-priya","https:\/\/www.facebook.com\/cookliciousveg\/","https:\/\/www.instagram.com\/cookilicious\/","https:\/\/www.pinterest.com\/cookiliciousveg\/","https:\/\/x.com\/cookiliciousveg","https:\/\/www.youtube.com\/channel\/UCDnOw9Dqi_9LFLXu0dYnb2A"],"birthDate":"1980-05-10","gender":"female","knowsAbout":["Food Blogging. Cookbook writing","Recipe Development","Food Photography","Indian Recipes","Vegan Recipes","Vegetarian Recipes","Global Recipes"],"knowsLanguage":["English","Hindi","Tamil","Marathi"],"jobTitle":"Food Blogger, Founder, Chef, Recipe Developer, Photographer, Cookbook Author","worksFor":"Cookilicious","url":"https:\/\/cookilicious.com\/author\/priya\/"},{"@type":"Question","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770421631345","position":1,"url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770421631345","name":"Which Type of Rava to Buy for Tomato Upma?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"For the perfect Tomato Rava Upma, use thick or coarse semolina, commonly labeled as Upma Rava or Bombay Rava in Indian grocery stores. This coarse variety gives your upma its signature fluffy, grainy texture. You can also buy pre-roasted rava to skip the roasting step at home — just make sure it’s not labeled as <em>semolina flour<\/em>.<br>If you’re in the US, <a href=\"https:\/\/rstyle.me\/+wP5qudEvY44ad7Ku6chmMA\" target=\"_blank\" rel=\"noreferrer noopener nofollow\">Cream of Wheat<\/a> from the breakfast cereal aisle works as a substitute; just roast it lightly before using. Avoid using idli rava, which is meant for making <a href=\"https:\/\/cookilicious.com\/idli-batter-recipe-with-idli-rava\/\">idlis<\/a> and won’t give the right texture.<br>Whether using fresh or store-roasted rava, roasting is essential. It brings out a nutty aroma, prevents the upma from becoming sticky, and ensures a soft, fluffy vegetable tomato rava upma every time.<br><em>The water and rava ratio that works for me is 1:4. For one cup of rava, I add 4 cups of water. <\/em>","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770051549965","position":2,"url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770051549965","name":"What Other Ingredients Can I Add to Rava Upma?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"You can add a variety of vegetables to make it more colorful and nutritious. Try adding green beans, bell peppers, corn, edamame, spinach, potatoes, cauliflower, or broccoli. The trick is to chop them small. You can also make it without onions if you prefer, or swap tomato puree with palak (spinach) puree to make a vibrant Spinach Uppitu, or use beetroot puree for a naturally sweet Beetroot Upma.<br>For a simpler version, skip the puree and add finely chopped fresh tomatoes while sautéing the vegetables — the cooking method remains the same. Pair this with <a href=\"https:\/\/cookilicious.com\/south-indian-tomato-almond-chutney-idli-dosa\/\">Tomato Chutney<\/a> for a classic South Indian flavor.<br>You can also enhance the taste by adding <a href=\"https:\/\/cookilicious.com\/sambhar-powder\/\">sambar powder<\/a> along with the basic spices, or experiment with the liquid used to cook the semolina. Instead of plain water, try tamarind water, milk, or <a href=\"https:\/\/cookilicious.com\/indian-spiced-buttermilk-ice-pops\/\">Indian chaas<\/a> (buttermilk) to give it a unique twist and richer flavor. With these variations, you can customize this upma recipe to suit your taste, dietary needs, or whatever vegetables you have on hand.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770346794656","position":3,"url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770346794656","name":"What Can I Use Instead of Rava for Tomato Upma?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"If you don’t have rava or want to make it gluten-free, there are plenty of delicious substitutes. You can use ragi, lapsi, or dalia instead of semolina, or try quinoa or rolled oats, similar to <a href=\"https:\/\/cookilicious.com\/instant-pot-oats-vegetable-upma-porridge\/\">Oats Upma<\/a> or <a href=\"https:\/\/cookilicious.com\/vegetable-quinoa-upma\/\">Quinoa Upma<\/a>. Other alternatives include millets, semiya (vermicelli), or even cauliflower rice for a low-carb version. Adjust the water quantity as needed depending on the base you choose. In the US, you can also use <a href=\"https:\/\/rstyle.me\/+wP5qudEvY44ad7Ku6chmMA\" target=\"_blank\" rel=\"noreferrer noopener nofollow\">Cream of Wheat<\/a> from the breakfast cereal aisle — just roast it lightly before using it. These swaps allow you to enjoy the comforting flavors of tomato rava upma even without traditional semolina, while keeping it healthy, customizable, and versatile.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770351445224","position":4,"url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770351445224","name":"Can I Make Tomato Semolina Upma in the Instant Pot?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Yes! It's quick and hassle-free to make it in the Instant Pot. Start by turning the Instant Pot to sauté mode and follow the recipe to add the spices, vegetables, and tempered lentils in order. Once the base is ready, add pre-roasted rava along with hot water, deglazing the pot to ensure nothing sticks to the bottom. Cancel the sauté mode, close the lid, and pressure cook on manual mode for 2 minutes. Release the pressure immediately using the quick-release method.<br>Carefully remove the stainless steel insert, sprinkle chopped cilantro and a squeeze of lemon juice, and gently mix. Cover the pot with a glass lid and let it rest for 5 minutes. This helps it set slightly and prevents it from becoming mushy. The texture is soft, fluffy, and slightly porridge-like — similar to Instant Pot <a href=\"https:\/\/cookilicious.com\/instant-pot-carrot-beets-khichdi\/\">Masala Khichdi<\/a>, or <a href=\"https:\/\/cookilicious.com\/simple-easy-instant-pot-quinoa-chickpeas-khichdi\/\">Quinoa Khichdi<\/a>, making it a perfect, hands-off version of this classic South Indian snack recipe.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770349643757","position":5,"url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1770349643757","name":"How to Store Leftover Tomato Rava Upma?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Leftovers can be stored in an airtight container in the fridge for 4–5 days. Since it tends to lose moisture, sprinkle a little water while reheating to bring back its soft, fluffy texture. Drizzling some vegan ghee over the warm upma enhances the flavor and richness, making it taste freshly made.<br>For longer storage, you can freeze rava upma for 2–3 months. Thaw it overnight in the fridge and reheat gently with a splash of water for a quick, comforting meal. You can also mash it slightly before reheating, as it tends to clamp together as it cools. Avoid overcooking while reheating to maintain the grainy texture of the semolina.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1771778636535","position":6,"url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#faq-question-1771778636535","name":"How to Reduce Prep Work When Making Upma?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"You can save time by roasting rava in bulk and storing it in an airtight container. This not only reduces the cooking time when making tomato rava upma but also extends the shelf life of the semolina.<br>Another great shortcut is to prepare an upma instant mix. Sauté all the spices, vegetables (minus the tomato puree), and lentils as per the recipe, then add the roasted rava and sauté for a few minutes. Let the mixture cool, transfer it to an airtight container, and store it in the fridge. When the craving hits, simply boil water, add this ready mix, and cook until it reaches the desired consistency. This method makes a quick, hassle-free tomato upma anytime, without compromising on flavor or texture.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Recipe","name":"South Indian Tomato Rava Upma Recipe","author":{"@id":"https:\/\/cookilicious.com\/#\/schema\/person\/8f403b7fc4de937adb8a1069e8da27e4"},"description":"Tomato Rava Upma is a flavorful twist on the classic South Indian rava upma recipe, where juicy tomatoes add a gentle tang and beautiful color to this comforting dish. Made with roasted semolina (rava\/sooji), everyday vegetables, and simple pantry spices, this vegetable upma is soft, fluffy, and incredibly satisfying. Naturally vegan and gluten-free, this mildly spiced upma recipe comes together in just 40 minutes, making it perfect for busy mornings. Serve this tomato upma for breakfast, brunch, or even as a light evening snack with coconut chutney or a cup of filter coffee.","datePublished":"2026-02-24T10:00:00+00:00","image":["https:\/\/cookilicious.com\/wp-content\/uploads\/2025\/04\/Tomato-Rava-Upma-30-scaled.jpg","https:\/\/cookilicious.com\/wp-content\/uploads\/2025\/04\/Tomato-Rava-Upma-30-500x500.jpg","https:\/\/cookilicious.com\/wp-content\/uploads\/2025\/04\/Tomato-Rava-Upma-30-500x375.jpg","https:\/\/cookilicious.com\/wp-content\/uploads\/2025\/04\/Tomato-Rava-Upma-30-480x270.jpg"],"recipeYield":["4","4 people"],"prepTime":"PT15M","cookTime":"PT25M","totalTime":"PT40M","recipeIngredient":["2 tsp chana dal","1 cup coarse rava","2  tomatoes","2  green chillies","1  onion","4 tbsp vegan ghee","1 tsp mustard seeds","1 tsp urad dal","1\/2 tsp GF asafoetida","5-6  fresh curry leaves","2 tbsp cashews","2 tbsp peanuts","1 tsp red chilly powder","1\/2 tsp turmeric powder","1\/2 cup frozen green peas and carrots","4 cups water","salt","1\/4 cup cilantro"],"recipeInstructions":[{"@type":"HowToStep","text":"Soak chana dal in water for about 10 minutes. This helps the lentils soften slightly so they cook evenly and add a gentle crunch to the vegetable rava upma.","name":"Soak chana dal in water for about 10 minutes. This helps the lentils soften slightly so they cook evenly and add a gentle crunch to the vegetable rava upma.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-0"},{"@type":"HowToStep","text":"Dry roast the coarse rava (sooji\/semolina) in a wide pan over medium heat until it releases a nutty aroma and begins to look dry, separate, and slightly crisp. Keep stirring continuously so it roasts evenly and doesn’t burn. This should take about 4–5 minutes. Do not let the rava brown. Immediately transfer the suji to a plate and set aside. Chef’s Tip: For extra flavor, you can add 1 teaspoon of ghee while roasting the rava. Roasting properly is the key to making soft, fluffy rava upma that’s light and non-sticky.","name":"Dry roast the coarse rava (sooji\/semolina) in a wide pan over medium heat until it releases a nutty aroma and begins to look dry, separate, and slightly crisp. Keep stirring continuously so it roasts evenly and doesn’t burn. This should take about 4–5 minutes. Do not let the rava brown. Immediately transfer the suji to a plate and set aside. Chef’s Tip: For extra flavor, you can add 1 teaspoon of ghee while roasting the rava. Roasting properly is the key to making soft, fluffy rava upma that’s light and non-sticky.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-1"},{"@type":"HowToStep","text":"Roughly chop the tomatoes. Finely chop the green chilies and thinly slice the onions. Keep all ingredients ready before starting, as this South Indian upma recipe comes together quickly.","name":"Roughly chop the tomatoes. Finely chop the green chilies and thinly slice the onions. Keep all ingredients ready before starting, as this South Indian upma recipe comes together quickly.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-2"},{"@type":"HowToStep","text":"Blend the chopped tomatoes into a smooth puree. No need to add water, as tomatoes release enough moisture naturally.","name":"Blend the chopped tomatoes into a smooth puree. No need to add water, as tomatoes release enough moisture naturally.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-3"},{"@type":"HowToStep","text":"Heat vegan ghee in a heavy-bottomed pan. Add mustard seeds and allow them to crackle. Then add urad dal and drained chana dal. Fry for about 30 seconds until lightly golden. Add asafoetida, minced green chilies, and curry leaves. Saute briefly until fragrant.","name":"Heat vegan ghee in a heavy-bottomed pan. Add mustard seeds and allow them to crackle. Then add urad dal and drained chana dal. Fry for about 30 seconds until lightly golden. Add asafoetida, minced green chilies, and curry leaves. Saute briefly until fragrant.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-4"},{"@type":"HowToStep","text":"Add sliced onions and ginger paste. Saute until the onions turn translucent and slightly soft.","name":"Add sliced onions and ginger paste. Saute until the onions turn translucent and slightly soft.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-5"},{"@type":"HowToStep","text":"Stir in cashews and peanuts. Saute for about a minute until they turn lightly golden and aromatic.","name":"Stir in cashews and peanuts. Saute for about a minute until they turn lightly golden and aromatic.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-6"},{"@type":"HowToStep","text":"Add frozen green peas and chopped carrots. Saute for 2 minutes until slightly tender but still vibrant.","name":"Add frozen green peas and chopped carrots. Saute for 2 minutes until slightly tender but still vibrant.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-7"},{"@type":"HowToStep","text":"Add the tomato puree, red chilly powder, and turmeric powder. Cook for 3–4 minutes until the mixture thickens and the raw tomato smell disappears. Add a splash of water if needed to prevent sticking.","name":"Add the tomato puree, red chilly powder, and turmeric powder. Cook for 3–4 minutes until the mixture thickens and the raw tomato smell disappears. Add a splash of water if needed to prevent sticking.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-8"},{"@type":"HowToStep","text":"Pour in room temperature water and bring it to a boil. Add salt, sugar, and a teaspoon of vegan ghee for added richness. The correct water-to-rava ratio helps achieve soft, lump-free upma. Chef's Tip - add a teaspoon of vegan ghee in the boiling water. This prevents the upma from sticking to the pan.","name":"Pour in room temperature water and bring it to a boil. Add salt, sugar, and a teaspoon of vegan ghee for added richness. The correct water-to-rava ratio helps achieve soft, lump-free upma. Chef's Tip - add a teaspoon of vegan ghee in the boiling water. This prevents the upma from sticking to the pan.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-9"},{"@type":"HowToStep","text":"Lower the flame and slowly add the roasted rava while continuously stirring to prevent lumps. Mix well so the rava absorbs the liquid evenly. Chef's tip - Adding rava gradually is the secret to making smooth sooji upma. Keep whisking as you add the sooji. Do not add them all at once.","name":"Lower the flame and slowly add the roasted rava while continuously stirring to prevent lumps. Mix well so the rava absorbs the liquid evenly. Chef's tip - Adding rava gradually is the secret to making smooth sooji upma. Keep whisking as you add the sooji. Do not add them all at once.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-10"},{"@type":"HowToStep","text":"Increase heat to medium and cook stirring occasionally. The mixture will thicken. Cook for about 4–5 minutes until it stops sticking to the pan and all the water is absorbed.","name":"Increase heat to medium and cook stirring occasionally. The mixture will thicken. Cook for about 4–5 minutes until it stops sticking to the pan and all the water is absorbed.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-11"},{"@type":"HowToStep","text":"The upma will come together like a soft dough. Turn off the flame, add a tablespoon of vegan ghee, cover and let it rest for 2 minutes for the best texture. Resting helps the rava upma recipe become softer and fluffier.","name":"The upma will come together like a soft dough. Turn off the flame, add a tablespoon of vegan ghee, cover and let it rest for 2 minutes for the best texture. Resting helps the rava upma recipe become softer and fluffier.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-12"},{"@type":"HowToStep","text":"Garnish with freshly chopped cilantro. Drizzle vegan ghee and gently fluff with a fork, and serve hot.","name":"Garnish with freshly chopped cilantro. Drizzle vegan ghee and gently fluff with a fork, and serve hot.","url":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#wprm-recipe-44460-step-0-13"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"1"},"recipeCategory":["Breakfast","Snack"],"recipeCuisine":["Indian","South Indian"],"keywords":"rava upma, tomato upma, upma","nutrition":{"@type":"NutritionInformation","calories":"386.19 kcal","carbohydrateContent":"45.55 g","proteinContent":"10.18 g","fatContent":"19.77 g","saturatedFatContent":"12.49 g","sodiumContent":"112.8 mg","fiberContent":"6.44 g","sugarContent":"4 g","unsaturatedFatContent":"5.37 g","servingSize":"1 serving"},"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#recipe","isPartOf":{"@id":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/#article"},"mainEntityOfPage":"https:\/\/cookilicious.com\/south-indian-tomato-rava-upma-recipe\/"}]}</script>
