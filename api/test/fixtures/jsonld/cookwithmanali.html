i-500x375.jpg","https:\/\/www.cookwithmanali.com\/wp-content\/uploads\/2026\/07\/ven-pongal-served-in-copper-kadai-480x270.jpg"],"video":{"name":"Ven Pongal Recipe","description":"Ven pongal is a savory rice and lentil dish which is popular in South India. This comforting dish is best enjoyed with a side of pickle or coconut chutney.","thumbnailUrl":"https:\/\/content.jwplatform.com\/thumbs\/rCaQvKPk-720.jpg","contentUrl":"https:\/\/content.jwplatform.com\/videos\/rCaQvKPk.mp4","uploadDate":"2026-07-31T22:45:58+00:00","@type":"VideoObject"},"recipeYield":["3"],"prepTime":"PT5M","cookTime":"PT25M","totalTime":"PT89M","recipeIngredient":["½ cup moong dal ( 100 grams , split skinless moong dal, soaked for 30 minutes.)","½ cup rice ( 100 grams , soaked for 30 minutes. Use any white rice, I used basmati rice)","2 teaspoons ginger (chopped, divided)","1 teaspoon  salt (adjust to taste)","2 &amp; ¼ cups water","1 cup milk (or use water in place)","2 &amp; ½ tablespoons ghee","1 teaspoon cumin seeds","1 teaspoon black peppercorn","¼ teaspoon hing","7-8  cashews (halved, use raw cashews)","1 sprig curry leaves"],"recipeInstructions":[{"@type":"HowToStep","text":"Add ½ cup moong dal and ½ cup rice into a large bowl. Rinse them until the water turns clear, then soak them in enough water for 30 minutes. After 30 minutes, drain the water in which they were soaked and then transfer them into the steel pot of an Instant Pot (or use a stove-top pressure cooker).","name":"Add ½ cup moong dal and ½ cup rice into a large bowl. Rinse them until the water turns clear, then soak them in enough water for 30 minutes. After 30 minutes, drain the water in which they were soaked and then transfer them into the steel pot of an Instant Pot (or use a stove-top pressure cooker).","url":"https:\/\/www.cookwithmanali.com\/ven-pongal\/#wprm-recipe-69528-step-0-0"},{"@type":"HowToStep","text":"Then add 1 teaspoon ginger (chopped), 1 teaspoon salt, 2 &amp;¼ cup water and 1 cup milk to the pot. Close the lid and pressure cook on high pressure for 5 minutes with the pressure valve in sealing position. Let the pressure release naturally. Rice and dal should be nicely cooked and have a creamy consistency at this point.If using a stovetop pressure cooker, pressure cook for 3 whistles on high heat and then turn off the heat and let the pressure release naturally.","name":"Then add 1 teaspoon ginger (chopped), 1 teaspoon salt, 2 &amp;¼ cup water and 1 cup milk to the pot. Close the lid and pressure cook on high pressure for 5 minutes with the pressure valve in sealing position. Let the pressure release naturally. Rice and dal should be nicely cooked and have a creamy consistency at this point.If using a stovetop pressure cooker, pressure cook for 3 whistles on high heat and then turn off the heat and let the pressure release naturally.","url":"https:\/\/www.cookwithmanali.com\/ven-pongal\/#wprm-recipe-69528-step-0-1"},{"@type":"HowToStep","text":"To make the tadka\/tempering, add 2&amp;½ tablespoons ghee to a pan on medium heat. Once the ghee is hot, add 1 teaspoon cumin seeds and let them sizzle, then add 1 teaspoon black peppercorns. Sauté them for 30 seconds. Then add ¼ teaspoon hing and stir.","name":"To make the tadka\/tempering, add 2&amp;½ tablespoons ghee to a pan on medium heat. Once the ghee is hot, add 1 teaspoon cumin seeds and let them sizzle, then add 1 teaspoon black peppercorns. Sauté them for 30 seconds. Then add ¼ teaspoon hing and stir.","url":"https:\/\/www.cookwithmanali.com\/ven-pongal\/#wprm-recipe-69528-step-0-2"},{"@type":"HowToStep","text":"Now, add 7-8 cashews (halves) and cook for 1 minutes until the cashews start changing color, then add remaining 1 teaspoon ginger (chopped) and stir. Cook 30-40 seconds and then add a sprig of curry leaves (approx. 8-10 curry leaves). Cook 30 seconds then add the prepared rice and dal mixture to the pan.","name":"Now, add 7-8 cashews (halves) and cook for 1 minutes until the cashews start changing color, th
