soned baby potatoes, finished with roasted lemon and fresh cilantro.","datePublished":"2026-08-04T10:26:08+00:00","image":["https:\/\/ministryofcurry.com\/wp-content\/uploads\/2026\/08\/sheet-pan-tandoori-chicken-with-vegetables.jpg","https:\/\/ministryofcurry.com\/wp-content\/uploads\/2026\/08\/sheet-pan-tandoori-chicken-with-vegetables-500x500.jpg","https:\/\/ministryofcurry.com\/wp-content\/uploads\/2026\/08\/sheet-pan-tandoori-chicken-with-vegetables-500x375.jpg","https:\/\/ministryofcurry.com\/wp-content\/uploads\/2026\/08\/sheet-pan-tandoori-chicken-with-vegetables-480x270.jpg"],"recipeYield":["4"],"prepTime":"PT20M","cookTime":"PT30M","totalTime":"PT50M","recipeIngredient":["2 lbs chicken drumsticks or chicken legs (skin removed)","½ cup plain whole milk yogurt","1 tablespoon garlic paste","1 tablespoon ginger paste","1 tablespoon lemon juice","1 to 2 tablespoons Kashmiri or other mild red chili powder","½ teaspoon ground turmeric","2 teaspoons garam masala","2 teaspoons kosher salt","1 tablespoon oil","1 lb cauliflower florets (cut into 1.5 x 1.5 inch florets)","½ teaspoon kosher salt","2 tablespoons reserved tandoori marinade","1.5 lbs mixed baby potatoes (small ones halved and large ones quartered)","1 tablespoon olive oil","1 teaspoon kosher salt","¼ teaspoon freshly ground black pepper","½ teaspoon onion powder","cilantro (fineli diced for garnish)","1  lemon (halved)","cucumber Raita (for serving)"],"recipeInstructions":[{"@type":"HowToStep","text":"Make several diagonal slits into each chicken piece. Whisk together the yogurt, garlic paste, ginger paste, lemon juice, red chili powder, turmeric, garam masala, kosher salt, and oil to make the tandoori marinade.","name":"Make several diagonal slits into each chicken piece. Whisk together the yogurt, garlic paste, ginger paste, lemon juice, red chili powder, turmeric, garam masala, kosher salt, and oil to make the tandoori marinade.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-0"},{"@type":"HowToStep","text":"Toss the chicken pieces in most of the marinade, working it into the slits. Set aside 2 tablespoons of marinade for the cauliflower. Marinate the chicken for at least 1 hour, or up to 24 hours in the refrigerator.","name":"Toss the chicken pieces in most of the marinade, working it into the slits. Set aside 2 tablespoons of marinade for the cauliflower. Marinate the chicken for at least 1 hour, or up to 24 hours in the refrigerator.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-1"},{"@type":"HowToStep","text":"Toss the cauliflower florets with the kosher salt and the reserved 2 tablespoons of tandoori marinade until evenly coated.","name":"Toss the cauliflower florets with the kosher salt and the reserved 2 tablespoons of tandoori marinade until evenly coated.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-2"},{"@type":"HowToStep","text":"In a separate bowl, toss the cut baby potatoes with the olive oil, kosher salt, black pepper, and onion powder until well coated.","name":"In a separate bowl, toss the cut baby potatoes with the olive oil, kosher salt, black pepper, and onion powder until well coated.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-3"},{"@type":"HowToStep","text":"Lightly brush or spray a large sheet pan with oil. Arrange the chicken pieces on the pan, then spread the cauliflower and potatoes around them in a single layer. Place the lemon halves in the middle of the tray.","name":"Lightly brush or spray a large sheet pan with oil. Arrange the chicken pieces on the pan, then spread the cauliflower and potatoes around them in a single layer. Place the lemon halves in the middle of the tray.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-4"},{"@type":"HowToStep","text":"Bake in a preheated oven at 400 to 425°F for 15 minutes.","name":"Bake in a preheated oven at 400 to 425°F for 15 minutes.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-5"},{"@type":"HowToStep","text":"Turn the chicken pieces over, rotate the tray, and bake for another 10 minutes.","name":"Turn the chicken pieces over, rotate the tray, and bake for another 10 minutes.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-6"},{"@type":"HowToStep","text":"Turn the chicken over once more and broil on high for 5 minutes, until charred in spots.","name":"Turn the chicken over once more and broil on high for 5 minutes, until charred in spots.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-7"},{"@type":"HowToStep","text":"Garnish with chopped cilantro, squeeze the roasted lemon over the chicken, and serve warm with cucumber raita.","name":"Garnish with chopped cilantro, squeeze the roasted lemon over the chicken, and serve warm with cucumber raita.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-0-8"},{"@type":"HowToSection","name":"Notes","itemListElement":[{"@type":"HowToStep","text":"For extra char, brush any leftover marinade onto the chicken when you flip it at the 15 minute mark.","name":"For extra char, brush any leftover marinade onto the chicken when you flip it at the 15 minute mark.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-1-0"},{"@type":"HowToStep","text":"Cut the potatoes and cauliflower to a similar size so everything finishes roasting at the same time.","name":"Cut the potatoes and cauliflower to a similar size so everything finishes roasting at the same time.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-1-1"},{"@type":"HowToStep","text":"Leftovers keep well in the refrigerator for up to 3 days and reheat nicely in a hot oven or air fryer.","name":"Leftovers keep well in the refrigerator for up to 3 days and reheat nicely in a hot oven or air fryer.","url":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#wprm-recipe-161600-step-1-2"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"5","ratingCount":"1","reviewCount":"1"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was really good! Turned out great!Love that veggies were included in this dish.","author":{"@type":"Person","name":"Chhaya"},"datePublished":"2026-08-09"}],"recipeCategory":["dinner","Entree"],"recipeCuisine":["Indian"],"suitableForDiet":["https:\/\/schema.org\/GlutenFreeDiet"],"keywords":"chicken","nutrition":{"@type":"NutritionInformation","calories":"418 kcal","carbohydrateContent":"42 g","proteinContent":"32 g","fatContent":"14 g","saturatedFatContent":"3 g","transFatContent":"0.04 g","cholesterolContent":"122 mg","sodiumContent":"2221 mg","fiberContent":"7 g","sugarContent":"6 g","unsaturatedFatContent":"10 g","servingSize":"1 serving"},"@id":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#recipe","isPartOf":{"@id":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/#article"},"mainEntityOfPage":"https:\/\/ministryofcurry.com\/sheet-pan-tandoori-chicken-and-vegetables\/"}]}</script>
