name: mobile
description: "Parimaan — household-shared meal planning and pantry app for Indian kitchens."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  amplify_flutter: ^2.15.0
  amplify_auth_cognito: ^2.15.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  ferry: ^0.16.1+2
  ferry_flutter: ^0.9.1+1
  gql_http_link: ^1.2.0
  gql_link: ^1.1.0
  gql_exec: ^1.1.1-alpha+1699813812660
  # AST types + printNode — appsync_websocket_link.dart uses these directly
  # (operation-type detection, re-serializing a request's document to send
  # over the AppSync realtime WS), not just transitively via gql_link.
  gql: ^1.0.1
  # AppSync's real-time protocol is a raw WebSocket subprotocol, not
  # `graphql-ws` — Ferry ships no AppSync transport (see
  # `appsync_websocket_link.dart`'s doc for the adopt-vs-hand-roll research,
  # E2E_MVP_PLAN.md §11.3 S8 step 1). `web_socket_channel` is the Dart team's
  # own low-level transport; everything above it here is hand-rolled.
  web_socket_channel: ^3.0.3
  built_value: ^8.12.7
  built_collection: ^5.1.1
  # DeepCollectionEquality — ProposedField<T>'s ==/hashCode need content
  # (not identity) equality when T is list-shaped (dietaryTags/ingredients/
  # steps on AiRecipeDraftState), W7 S7.
  collection: ^1.19.1
  # Delivers the `parimaan://join?code=XXXXXX` invite deep link. Chosen over
  # `uni_links` (unmaintained since 2023) and over a hand-rolled platform
  # channel: this is one plugin for two platforms' link plumbing, and hand-
  # rolling it would be more native code to maintain for no behavioural gain.
  # The link payload is untrusted input — `join_deep_link.dart` validates its
  # shape and NEVER auto-joins; see that file.
  app_links: ^6.4.0
  # W5 S7 — the local pantry read cache (E2E_MVP_PLAN.md §11.3 S7 step 1).
  # Confirmed against the SD §9.1-locked choice, not deviated: the required
  # cheaper-alternative check (Ferry's own persisted Hive `Cache`, which
  # client.dart already has a hook for) was ruled out — hive/hive_flutter
  # are unmaintained, last published 2021-2022, targeting a pre-null-safety
  # SDK range. `drift_flutter` is the current official convenience package
  # for wiring a native/web-portable sqlite3 database; `sqlite3_flutter_libs`
  # bundles the native binaries it needs (its `+eol` version suffix is that
  # package's own current pin, not a deprecation of this dependency).
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned below 2.34.1, NOT `^2.34.5` (latest): 2.34.1+ requires
  # `analyzer ^13.0.0`, which conflicts with `built_value_generator`/
  # `ferry_generator`'s `analyzer <13.0.0` ceiling — exactly the
  # three-generators-in-one-pipeline risk E2E_MVP_PLAN.md §11.3 S7 flagged
  # as the most likely place this slice burns unplanned time. `2.34.0`
  # supports `analyzer >=10.0.0 <13.0.0`, which the already-resolved
  # `analyzer 12.1.0` satisfies for every generator at once.
  drift_dev: ">=2.33.0 <2.34.1"

  # FakeWebSocketChannel (test/support/) mixes in StreamChannelMixin directly,
  # rather than transitively through web_socket_channel.
  stream_channel: ^2.1.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  alchemist: ^0.14.0
  # `HouseholdSyncPolicy` is timer-driven, and a poll cadence tested with real
  # `Future.delayed`s would make the suite take minutes and be flaky. Declared
  # explicitly rather than relied on as a `flutter_test` transitive, per
  # `depend_on_referenced_packages`.
  fake_async: ^1.3.1
  build_runner: ^2.15.1
  ferry_generator: ^0.12.0+5
  built_value_generator: ^8.12.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Attribution + summary (not the full licence text — see assets/licenses/
  # OFL.txt and ICONS.txt for what's actually bundled vs. linked) is here so
  # the About screen can render it from the app itself.
  #
  # assets/branding/ is the source for the app icon (flutter_launcher_icons)
  # and splash screen (flutter_native_splash) config below, and is bundled as
  # a Flutter asset too so an in-app screen (e.g. About) can render it without
  # a second copy. Canonical source lives in the repo root's `branding/`.
  assets:
    - assets/licenses/
    - assets/branding/

  # Fonts are EMBEDDED, never fetched from Google Fonts at runtime.
  # Family names and weights come from shared/design-tokens.json ->
  # `typography.families` and `fonts.families`; the family strings below must
  # stay identical to AppFontFamily in lib/shared/ui/typography.dart.
  # All four families are SIL OFL 1.1 — see assets/licenses/OFL.txt.
  fonts:
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          weight: 400
          style: italic

    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

    # Wordmark only ("परिमाण"), plus one appearance on the About screen.
    - family: Noto Serif Devanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifDevanagari-Bold.ttf
          weight: 700

    # Phosphor Icons, Regular (1.5px stroke) — MIT, see assets/licenses/ICONS.txt.
    - family: Phosphor
      fonts:
        - asset: assets/icons/Phosphor-Regular.ttf
          weight: 400

# App icon, generated by `dart run flutter_launcher_icons` from the mark
# (green rounded square + प glyph, #4F6B4A — matches design-tokens.json's
# `color.brand.cardamom` exactly, verified against the source SVG). The PNG
# already bakes in its own rounded-square background, so this is one flat
# image for both platforms rather than a separate adaptive foreground/
# background pair — there is no transparent-only glyph asset to split it
# with, and iOS/legacy-Android masking already gets the right shape from the
# baked-in square.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/parimaan-mark-1024.png"
  # The mark PNG's corners are transparent (only the rounded rect is
  # opaque) — the App Store rejects an alpha channel on iOS icons, since iOS
  # applies its own corner mask. This flattens the transparent corners to
  # the mark's own green square color instead of leaving them see-through.
  remove_alpha_ios: true
  background_color_ios: "#4F6B4A"

# Splash screen, generated by `dart run flutter_native_splash:create`. The
# mark centered on `paper` (#FBF6EE, design-tokens.json's app-background
# token) — same visual language as flutter_launcher_icons above, just
# without a second asset to keep in sync.
flutter_native_splash:
  color: "#FBF6EE"
  image: "assets/branding/parimaan-mark-1024.png"
  android_12:
    color: "#FBF6EE"
    image: "assets/branding/parimaan-mark-1024.png"
