#import "./household_settings_fields.graphql"

# `Mutation.updateHouseholdSettings` — applies a PARTIAL patch to one
# household's settings.
#
# Every field of `HouseholdSettingsInput` is optional and an absent field
# leaves that column unchanged; an explicit `null` is rejected server-side
# (`api/src/validation/updateHouseholdSettings.ts`). A patch with every field
# absent is rejected too — there is nothing for the resolver to do with it.
#
# The setup wizard calls this once per step ("patch per step"), so most calls
# carry exactly one field.
#
# Unlike `create_household.graphql` this selects only `HouseholdSettings` —
# that is the mutation's whole return type. Nothing about the household's
# identity, invite code or membership can change through this path, so there
# is no wider shape to re-fetch. Imports `household_settings_fields.graphql`
# directly, not `household_fields.graphql` — the latter also defines
# `HouseholdFields`, which this operation never spreads, and a real GraphQL
# server rejects a document that defines a fragment it never uses (see that
# file's doc for the concrete error this produced).
mutation UpdateHouseholdSettings(
  $householdId: ID!
  $input: HouseholdSettingsInput!
) {
  updateHouseholdSettings(householdId: $householdId, input: $input) {
    ...HouseholdSettingsFields
  }
}
