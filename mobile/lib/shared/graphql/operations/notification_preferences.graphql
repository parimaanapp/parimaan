#import "./notification_preferences_fields.graphql"

# `Query.notificationPreferences` — always the CALLER's own row for
# `householdId`; there is no argument for a target user. A caller with no
# row yet gets the SD-specified TRUE defaults computed server-side, never an
# implicit write (W8 S8).
query NotificationPreferences($householdId: ID!) {
  notificationPreferences(householdId: $householdId) {
    ...NotificationPreferencesFields
  }
}
