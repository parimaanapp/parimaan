#import "./household_settings_fields.graphql"

# `Query.me` — the authenticated caller, upserted server-side on first login.
#
# `households` is requested here (it is a separate field resolver server-side,
# see the SDL comment on `Query.me`) but each membership's `household` is NOT
# expanded: `User -> HouseholdMembership -> Household -> members -> User` is a
# cycle, and the server deliberately returns an empty `members` list for a
# membership's own household (`api/src/mappers/household.ts`
# `toGraphQLMembership`). Asking for more here would buy nothing and add depth.
# `settings` reuses `HouseholdSettingsFields` — the same fragment
# `updateHouseholdSettings` and (transitively, via `HouseholdFields`) every
# other household operation share — so `household_mapper.dart`'s settings
# mapper serves this operation too rather than growing a fifth copy. Imports
# `household_settings_fields.graphql` directly, not `household_fields.graphql`
# — the latter also defines `HouseholdFields`, which this query never
# spreads, and a real GraphQL server rejects a document that defines a
# fragment it never uses (see that file's doc for the concrete error this
# produced).
query Me {
  me {
    id
    email
    displayName
    avatarUrl
    households {
      id
      role
      joinedAt
      household {
        id
        name
        inviteCode
        primaryUserId
        subscriptionStatus
        settings {
          ...HouseholdSettingsFields
        }
      }
    }
  }
}
