# `Query.recipes` — a household's recipes, optionally filtered by `role`,
# `isFavorite`, and/or `inRotation` (the last added W10 §16.2.5 — the
# picker's "rotation only" affordance), all applied server-side
# (`api/src/repositories/recipeRepository.ts`). Deliberately does not select
# `ingredients` — that's a separate field resolver (`Recipe.ingredients`)
# meant only for the Detail screen (a later slice), so a Library-scale query
# never pays for hydrating every recipe's full ingredient list
# (E2E_MVP_PLAN.md §12.2.7).
#
# Slim and paged (Build B, B2c): the card-scale selection drops `steps`,
# `description` and `sourceUrl` (the heaviest columns, only the Detail screen
# needs them), and `limit`/`offset` page the server-ordered list so 200+
# recipes load page by page instead of in one payload.
#
# Any member may read. A non-member and a nonexistent `householdId` deny
# identically (see `Query.household`'s doc for the same convention).
query Recipes($householdId: ID!, $role: RecipeRole, $isFavorite: Boolean, $inRotation: Boolean, $limit: Int, $offset: Int) {
  recipes(householdId: $householdId, role: $role, isFavorite: $isFavorite, inRotation: $inRotation, limit: $limit, offset: $offset) {
    id
    householdId
    sourceType
    title
    servings
    prepMin
    cookMin
    cuisineTier1
    cuisineTier2
    dietaryTags
    role
    inRotation
    isFavorite
    createdAt
    updatedAt
  }
}
