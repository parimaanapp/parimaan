#import "./shopping_list_item_fields.graphql"

# The one canonical `ShoppingList` selection set, shared by
# `generateShoppingList`, `regenerateShoppingList`, `haveIt`, `markPurchased`
# (D1's widened `haveIt`/`markPurchased` return types, E2E_MVP_PLAN.md
# §17.2.1/§18.2.1) and `onShoppingListChanged` (whose own pushed payload is
# this same full `ShoppingList!`, W12 S3/S4) — same "one fragment, one
# mapper" reasoning as `MenuFields`.
fragment ShoppingListFields on ShoppingList {
  id
  householdId
  generatedFromMenuId
  createdAt
  closedAt
  aiStaplesNote
  items {
    ...ShoppingListItemFields
  }
}
