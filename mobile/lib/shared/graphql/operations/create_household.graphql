#import "./household_fields.graphql"

# `Mutation.createHousehold` — creates a household with the caller as its
# `primary` member, default settings, and a generated invite code.
#
# The full `Household` shape is requested (settings + members) because the
# first-run flow lands the user straight into a household screen that needs
# both, and a second round trip against a cold Aurora Serverless v2 instance is
# the one thing worth avoiding here.
#
# The selection set moved into the shared `HouseholdFields` fragment when
# `joinHousehold` / `rotateInviteCode` / `Query.household` landed — see that
# file for why. Nothing about what is requested changed.
mutation CreateHousehold($name: String!) {
  createHousehold(name: $name) {
    ...HouseholdFields
  }
}
