document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 margin: 0; padding: 0; background: #F5EFE4; font-family: 'DM Sans', system-ui, sans-serif; color: #1F1A15; }\n  a { color: #A64420; text-decoration: none; border-bottom: 1px solid rgba(166,68,32,0.3); }\n  a:hover { color: #7A2E12; border-bottom-color: #7A2E12; }\n  * { box-sizing: border-box; }\n  ::selection { background: #E8B961; color: #1F1A15; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: 1680px; margin: 0 auto; padding: 64px 56px 120px; font-family: 'DM Sans', system-ui, sans-serif; color: #1F1A15;\">\n\n  <!-- Masthead -->\n  <header style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 64px; padding-bottom: 40px; border-bottom: 1px solid rgba(31,26,21,0.12); margin-bottom: 56px;\">\n    <div>\n      <div style=\"display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px; background: rgba(194,90,43,0.1); border-radius: 999px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #A64420; font-weight: 600; margin-bottom: 24px;\">\n        <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #C25A2B;\"><\u002Fspan>\n        Wireframes · v2 · Design-system aligned\n      <\u002Fdiv>\n      <h1 style=\"font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 72px; line-height: 0.95; letter-spacing: -0.02em; margin: 0 0 16px;\">\n        <span style=\"font-family: 'Noto Serif Devanagari', serif; font-weight: 500;\">परिमाण<\u002Fspan>\n        <span style=\"font-style: italic; color: #A64420;\"> Wireframes<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size: 17px; line-height: 1.5; max-width: 620px; margin: 0; color: #5A4F42;\">Fully styled wireframes aligned to the Haldi &amp; Terracotta design system. Covers auth, household setup, meal planning (breakfast+snacks, lunch, dinner), recipe management, pantry, shopping list generation, and edge cases.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-left: 1px solid rgba(31,26,21,0.12); padding-left: 40px;\">\n      <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7C6B; margin-bottom: 16px; font-weight: 600;\">Meal structure<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #5A4F42; line-height: 1.8;\">\n        <div><strong style=\"color: #1F1A15;\">Breakfast<\u002Fstrong> — 1 recipe (e.g. Poha, Idli)<\u002Fdiv>\n        <div><strong style=\"color: #1F1A15;\">Lunch<\u002Fstrong> — up to 3 types × 3 each (Carb, Sabzi/Dal, Accomp.)<\u002Fdiv>\n        <div><strong style=\"color: #1F1A15;\">Dinner<\u002Fstrong> — same structure as lunch<\u002Fdiv>\n        <div style=\"font-size: 11px; color: #8B7C6B; margin-top: 8px;\">Users toggle which meals to plan. Unchecked = hidden everywhere.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7C6B; margin-bottom: 8px; margin-top: 20px; font-weight: 600;\">Recipe images<\u002Fdiv>\n      <div style=\"font-size: 13px; color: #5A4F42; line-height: 1.6;\">\n        Pre-added → photos · URL import → fetched · User-added → optional upload\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 64px;\">\n    {{ flowIndex }}\n  <\u002Fnav>\n\n  {{ flowSections }}\n\n  <footer style=\"padding-top: 40px; margin-top: 80px; border-top: 1px solid rgba(31,26,21,0.12); display: flex; justify-content: space-between; align-items: flex-end; font-size: 12px; color: #8B7C6B;\">\n    <div>\n      <div style=\"font-family: 'Noto Serif Devanagari', serif; font-size: 20px; color: #1F1A15; margin-bottom: 4px;\">परिमाण<\u002Fdiv>\n      Wireframes v2 · Haldi &amp; Terracotta\n    <\u002Fdiv>\n    <div style=\"text-align: right;\">{{ frameCount }} frames · {{ flowCount }} flows<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  renderVals() {\n    const R = React.createElement;\n    // ── Design system tokens ──\n    const C = {\n      paper: '#FBF6EE', paper2: '#F5EFE4', card: '#FFFFFF',\n      inkSoft: '#5A4F42', inkMid: '#8B7C6B', ink: '#1F1A15',\n      haldiSoft: 'rgba(232,185,97,0.15)', haldi: '#E8B961',\n      terra: '#C25A2B', terraDeep: '#A64420',\n      carda: '#4F6B4A', cardaSoft: 'rgba(79,107,74,0.12)',\n      danger: '#9E2A2B', dangerSoft: 'rgba(158,42,43,0.1)',\n    };\n    const FW = 280, FH = 520;\n    // ── Style helpers ──\n    const S = {\n      frame: { width: FW, height: FH, background: C.card, border: '1px solid rgba(31,26,21,0.08)', borderRadius: 28, display: 'flex', flexDirection: 'column', flexShrink: 0, fontFamily: \"'DM Sans', sans-serif\", fontSize: 12, color: C.ink, overflow: 'hidden', position: 'relative', boxShadow: '0 1px 2px rgba(31,26,21,0.04), 0 4px 12px rgba(31,26,21,0.06)' },\n      statusBar: { height: 22, padding: '0 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontFamily: \"'JetBrains Mono', monospace\", fontSize: 9, color: C.inkMid },\n      topBar: { padding: '10px 16px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, flexShrink: 0 },\n      title: { fontFamily: \"'Instrument Serif', serif\", fontSize: 20, lineHeight: '1.1', fontWeight: 400 },\n      body: { flex: 1, padding: '10px 16px', overflow: 'hidden', display: 'flex', flexDirection: 'column', gap: 8 },\n      label: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: 9, letterSpacing: '0.12em', textTransform: 'uppercase', color: C.inkMid, fontWeight: 600 },\n      hint: { fontSize: 10, color: C.inkMid, lineHeight: '1.4' },\n      row: { display: 'flex', alignItems: 'center', gap: 8, padding: '8px 0', borderBottom: '1px solid rgba(31,26,21,0.06)' },\n      ai: { display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 8px', background: C.haldiSoft, color: '#7A5A18', borderRadius: 999, fontFamily: \"'JetBrains Mono', monospace\", fontSize: 9, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em' },\n    };\n    const chip = (text, on = false) => R('div', { key: text, style: { display: 'inline-block', padding: '5px 12px', background: on ? C.ink : 'transparent', color: on ? C.paper : C.ink, border: on ? 'none' : '1px solid rgba(31,26,21,0.2)', borderRadius: 999, fontSize: 11, fontWeight: 500 } }, text);\n    const tagChip = (text, bg, fg) => R('span', { key: text, style: { padding: '3px 9px', background: bg, color: fg, borderRadius: 6, fontSize: 10, fontWeight: 500 } }, text);\n    const cta = (text, variant = 'primary') => {\n      const styles = {\n        primary: { padding: '11px 16px', background: C.terra, color: C.paper, border: 'none', borderRadius: 12, fontSize: 13, fontWeight: 600, textAlign: 'center' },\n        secondary: { padding: '11px 16px', background: 'transparent', color: C.ink, border: '1px solid rgba(31,26,21,0.2)', borderRadius: 12, fontSize: 13, fontWeight: 500, textAlign: 'center' },\n        affirm: { padding: '11px 16px', background: C.carda, color: C.paper, border: 'none', borderRadius: 12, fontSize: 13, fontWeight: 600, textAlign: 'center' },\n        dark: { padding: '11px 16px', background: C.ink, color: C.paper, border: 'none', borderRadius: 12, fontSize: 13, fontWeight: 600, textAlign: 'center' },\n        ghost: { padding: '10px 16px', background: 'transparent', color: C.terraDeep, border: 'none', borderRadius: 12, fontSize: 13, fontWeight: 500, textAlign: 'center' },\n        danger: { padding: '11px 16px', background: 'transparent', color: C.danger, border: '1px solid rgba(158,42,43,0.25)', borderRadius: 12, fontSize: 13, fontWeight: 500, textAlign: 'center' },\n      };\n      return R('div', { style: styles[variant] || styles.primary }, text);\n    };\n    const inputField = (label, value, opts = {}) => R('div', null,\n      R('div', { style: { ...S.label, marginBottom: 4 } }, label),\n      R('div', { style: { padding: '9px 12px', background: C.card, border: opts.focused ? '1.5px solid ' + C.terra : '1px solid rgba(31,26,21,0.15)', borderRadius: 10, fontSize: 13, color: value ? C.ink : C.inkMid, fontFamily: opts.mono ? \"'JetBrains Mono', monospace\" : 'inherit', boxShadow: opts.focused ? '0 0 0 3px rgba(194,90,43,0.12)' : 'none' } }, value || opts.placeholder || '…'),\n    );\n    // ── Logo mark ──\n    const LogoMark = (size = 40) => R('div', { style: { width: size, height: size, background: C.carda, borderRadius: size * 0.3, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: \"'Noto Serif Devanagari', serif\", fontSize: size * 0.5, fontWeight: 700, color: C.paper, flexShrink: 0, lineHeight: '1', paddingTop: size * 0.05 } }, 'प');\n    // ── Frame wrapper ──\n    const Frame = (label, children, opts = {}) => R('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },\n      R('div', { style: { display: 'flex', alignItems: 'baseline', gap: 8, minHeight: 24 } },\n        R('div', { style: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: 11, fontWeight: 600, color: C.terra } }, opts.id || ''),\n        R('div', { style: { fontSize: 12, fontWeight: 500 } }, label),\n      ),\n      opts.note ? R('div', { style: { fontSize: 11, color: C.inkMid, lineHeight: '1.4', maxWidth: FW, marginBottom: -2 } }, opts.note) : null,\n      R('div', { style: S.frame }, children),\n    );\n    const StatusBar = () => R('div', { style: S.statusBar }, '9:41', R('span', null, '●●● ▮'));\n    const TopBar = (title, opts = {}) => R('div', { style: S.topBar },\n      opts.back ? R('div', { style: { fontSize: 16, color: C.inkMid } }, '‹') : R('div', { style: { width: 10 } }),\n      R('div', { style: { ...S.title, textAlign: 'center', flex: 1 } }, title),\n      opts.right ? R('div', { style: { fontSize: 13, color: C.inkMid, fontWeight: 500 } }, opts.right) : R('div', { style: { width: 10 } }),\n    );\n    const TabBar = (active = 'today') => {\n      const tabs = [['today', 'Today', '◉'], ['plan', 'Plan', '▦'], ['pantry', 'Pantry', '◈'], ['list', 'List', '☰']];\n      return R('div', { style: { height: 48, borderTop: '1px solid rgba(31,26,21,0.08)', display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', flexShrink: 0, background: C.card } },\n        tabs.map(([id, label, icon]) => R('div', { key: id, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2, fontSize: 10, color: active === id ? C.ink : C.inkMid, fontWeight: active === id ? 600 : 400 } },\n          R('div', { style: { fontSize: 16 } }, icon), label,\n        ))\n      );\n    };\n    const Arrow = () => R('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', width: 32, flexShrink: 0, fontSize: 18, color: C.inkMid } }, '→');\n    const FlowRow = (frames) => R('div', { style: { display: 'flex', alignItems: 'flex-start', gap: 12, flexWrap: 'wrap' } },\n      frames.reduce((acc, f, i) => { acc.push(R('div', { key: i }, f)); if (i < frames.length - 1) acc.push(R('div', { key: 'a' + i }, Arrow())); return acc; }, [])\n    );\n    const CheckRow = (name, qty, done = false) => R('div', { style: { display: 'flex', alignItems: 'center', gap: 10, padding: '7px 0', borderBottom: '1px solid rgba(31,26,21,0.06)' } },\n      R('div', { style: { width: 18, height: 18, borderRadius: 6, border: done ? 'none' : '1.5px solid rgba(31,26,21,0.25)', background: done ? C.carda : 'transparent', color: C.paper, fontSize: 11, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 } }, done ? '✓' : ''),\n      R('div', { style: { flex: 1, fontSize: 13, textDecoration: done ? 'line-through' : 'none', color: done ? C.inkMid : C.ink } }, name),\n      R('div', { style: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: 11, color: C.inkMid } }, qty),\n    );\n    // Recipe image placeholder\n    const RecipeImg = (name, hasPhoto, color = C.terra) => R('div', { style: { height: 56, background: hasPhoto ? color : C.paper, border: hasPhoto ? 'none' : '1.5px dashed rgba(31,26,21,0.2)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden' } },\n      hasPhoto\n        ? R('div', { style: { fontFamily: \"'Instrument Serif', serif\", fontSize: 14, color: C.paper, fontStyle: 'italic', padding: '0 10px', textAlign: 'center' } }, name)\n        : R('div', { style: { fontSize: 9, color: C.inkMid, fontFamily: \"'JetBrains Mono', monospace\" } }, '＋ photo'),\n    );\n\n    // ═══════ FLOW 1 — AUTH & ONBOARDING ═══════\n    const flow1 = [\n      Frame('Splash', [\n        StatusBar(),\n        R('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 24, gap: 16 } },\n          LogoMark(72),\n          R('div', { style: { fontFamily: \"'Instrument Serif', serif\", fontSize: 28 } }, 'Parimaan'),\n          R('div', { style: { fontSize: 12, color: C.inkMid, textAlign: 'center' } }, 'Meal planning for Indian kitchens'),\n        ),\n      ], { id: '1.1' }),\n      Frame('Sign in', [\n        StatusBar(),\n        R('div', { style: { flex: 1, padding: 24, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' } },\n          R('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 } },\n            LogoMark(56),\n            R('div', { style: { fontFamily: \"'Instrument Serif', serif\", fontSize: 24, textAlign: 'center' } }, 'Welcome'),\n            R('div', { style: { fontSize: 13, color: C.inkSoft, textAlign: 'center' } }, 'Sign in to Parimaan'),\n          ),\n          R('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },\n            R('div', { style: { padding: 13, border: '1px solid rgba(31,26,21,0.2)', borderRadius: 12, textAlign: 'center', fontSize: 13, fontWeight: 500 } }, '◯  Continue with Google'),\n            R('div', { style: S.hint }, 'MVP: Google only. Email/OTP in v1.1.'),\n          ),\n        ),\n      ], { id: '1.2' }),\n      Frame('First run — choose path', [\n        StatusBar(),\n        R('div', { style: { flex: 1, padding: 24 } },\n          R('div', { style: { fontFamily: \"'Instrument Serif', serif\", fontSize: 24, marginBottom: 6 } }, 'Get started'),\n          R('div', { style: { fontSize: 12, color: C.inkMid, marginBottom: 24 } }, 'Are you setting things up, or joining someone?'),\n          R('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },\n            R('div', { style: { border: '1.5px solid ' + C.terra, borderRadius: 14, padding: 16 } },\n              R('div', { style: { fontWeight: 600, fontSize: 14, marginBottom: 4 } }, 'Create household'),\n              R('div', { style: { fontSize: 11, color: C.inkMid } }, \"You'll be the primary user\"),\n            ),\n            R('div', { style: { border: '1px solid rgba(31,26,21,0.2)', borderRadius: 14, padding: 16 } },\n              R('div', { style: { fontWeight: 600, fontSize: 14, marginBottom: 4 } }, 'Join with invite code'),\n              R('div', { style: { fontSize: 11, color: C.inkMid } }, '6-character code from a member'),\n            ),\n          ),\n        ),\n      ], { id: '1.3' }),\n      Frame('Notifications prompt', [\n        StatusBar(),\n        R('div', { style: { flex: 1, padding: 24, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' } },\n          R('div', null,\n            R('div', { style: { width: 56, height: 56, border: '1.5px dashed rgba(31,26,21,0.2)', borderRadius: 16, marginBottom: 20, display: 'flex', alignItems: 'center', justifyContent: 'center' } },\n              R('div', { style: { fontSize: 24 } }, '🔔'),\n            ),\n            R('div', { style: { fontFamily: \"'Instrument Serif', serif\", fontSize: 22, marginBottom: 8 } }, 'Stay in the loop'),\n            R('div', { style: { fontSize: 13, color: C.inkSoft, lineHeight: '1.5' } }, 'Get pinged when someone adds to the list, when meals sta mplateColumns: '1fr auto', alignItems: 'baseline', gap: 24, marginBottom: 8 } },\n            R('div', { style: { display: 'flex', alignItems: 'baseline', gap: 16 } },\n              R('span', { style: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: 13, color: C.terra, fontWeight: 500 } }, f.num),\n              R('h2', { style: { fontFamily: \"'Instrument Serif', serif\", fontWeight: 400, fontSize: 36, margin: 0, letterSpacing: '-0.01em' } }, f.title),\n            ),\n            R('div', { style: { fontFamily: \"'JetBrains Mono', monospace\", fontSize: 11, color: C.inkMid } }, f.frames.length + ' frames'),\n          ),\n          R('p', { style: { maxWidth: 720, color: C.inkSoft, fontSize: 14, lineHeight: '1.5', margin: '0 0 28px' } }, f.note),\n          FlowRow(f.frames),\n        )\n      )\n    );\n\n    const flowIndex = R('div', { style: { display: 'contents' } },\n      flows.map(f =>\n        R('a', { key: f.num, href: '#flow-' + f.num, style: { display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px', border: '1px solid rgba(31,26,21,0.1)', borderRadius: 10, background: C.paper, color: C.ink, textDecoration: 'none', borderBottom: '1px solid rgba(31,26,21,0.1)' } },\n          R('span', { style: { color: C.terra, fontFamily: \"'JetBrains Mono', monospace\", fontSize: 11, fontWeight: 500 } }, f.num),\n          R('span', { style: { fontSize: 12, fontWeight: 500 } }, f.title),\n        )\n      )\n    );\n\n    return {\n      flowSections, flowIndex,\n      frameCount: flows.reduce((a, f) => a + f.frames.length, 0),\n      flowCount: flows.length,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
